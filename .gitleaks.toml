# Settings for the secret scan in .github/workflows/test.yml (the "workflow lint" job).
# The default rule set stays on. Only one pattern is allowed by rule: a throwaway fixture
# assignment in a Go or Python test file. Every other known false positive in the history is
# listed by fingerprint in .gitleaksignore, so a new finding anywhere else, docs and runbooks
# included, fails the scan.
title = "report portal gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Throwaway test fixtures: a SecretKey, password or token literal assigned in a test file"
condition = "AND"
paths = [
  '''_test\.(go|py)$''',
]
regexTarget = "line"
regexes = [
  '''(?i)(secretkey|password|passwd|secret|apitoken|rotoldkey|rotnewkey)["']?\s*(:=|[:=,])\s*["']''',
]
