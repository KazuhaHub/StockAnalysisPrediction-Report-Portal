# Dedicated loopback listener for one pinned proxy destination (doc 186 sections 7 and 14, P4).
#
# Put this file OUTSIDE any directory a panel regenerates (aaPanel rewrites /www/server/panel/vhost/nginx/<site>.conf
# whenever the site is edited), include it once from the http context, and run
#   scripts/probe-proxy-pin-listener.sh --nginx-include <this file> --upstream-log <frp upstream log>
# after the first load and after every panel edit of the site.
#
# Replace the name, the certificate paths and the upstream. Everything else is the contract the probe checks:
#   - this is the only listen on port 20443, and it is bound to loopback: never [::]:20443, never 0.0.0.0, never a
#     bare 20443, because the runner reaches it as 127.0.0.1:20443 and nothing else may;
#   - any SNI other than the name meets the default_server block, whose ssl_reject_handshake on refuses the
#     handshake before a certificate is sent;
#   - a request whose host is not the name answers 421. nginx selects the server block again from $host (the Host
#     header, or the host of an absolute-URI request line), so such a request reaches the default_server block,
#     whose return 421 answers it; GET https://portal.example/ with the right SNI is refused too. The if in the
#     named block is a second guard only;
#   - the upstream is sent the fixed name, never $http_host.
#
# The certificate is the one the site already has (Let's Encrypt, DNS-01), because the application connects to
# https://quotes.internal.anchan.kazuhahub.com and verifies it.

server {
    listen 127.0.0.1:20443 ssl default_server;
    ssl_reject_handshake on;
    # After the handshake nginx picks the server block again from the request's host. A request that arrived
    # with the right SNI but names another host lands here, not in the block below, so this block answers 421.
    return 421;
}

server {
    listen 127.0.0.1:20443 ssl;
    server_name quotes.internal.anchan.kazuhahub.com;

    ssl_certificate     /path/to/quotes.internal.anchan.kazuhahub.com/fullchain.pem;
    ssl_certificate_key /path/to/quotes.internal.anchan.kazuhahub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    if ($host != "quotes.internal.anchan.kazuhahub.com") {
        return 421;
    }

    location / {
        # The frp tunnel's local end. The fixed name is what the upstream sees, whatever the client sent.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host quotes.internal.anchan.kazuhahub.com;
    }
}
