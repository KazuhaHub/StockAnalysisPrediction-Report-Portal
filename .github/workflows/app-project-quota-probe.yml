name: app project quota probe
on:
  pull_request:
    paths:
      - 'internal/apprunner/data/**'
      - 'internal/apprunner/driver/**'
      - 'internal/apprunner/journal/**'
      - 'internal/apprunner/transport/**'
      - 'internal/app/app_platform_data*'
      - 'internal/app/app_platform_managed_*'
      - 'internal/app/app_platform_candidate*'
      - 'internal/app/app_platform_readiness*'
      - 'internal/appplatform/backend_readiness*'
      - 'internal/appplatform/backend_registration*'
      - 'internal/app/app_platform_backend_identity*'
      - 'internal/app/app_platform_install_stage*'
      - 'internal/app/app_platform_install_worker*'
      - 'internal/app/app_platform_install_queue*'
      - 'internal/app/app_platform_install_scheduler*'
      - 'internal/app/app_platform_install_service*'
      - 'internal/app/app_platform_lease*'
      - 'internal/app/app_platform_install_review*'
      - 'internal/app/app_platform_release*'
      - 'internal/app/app_platform_actor*'
      - 'internal/app/app_platform_trust*'
      - 'internal/app/app_platform_install_audience*'
      - 'internal/app/app_platform_activation*'
      - 'internal/app/app_platform_frontend*'
      - 'internal/app/app_platform_install_profile*'
      - 'internal/app/app_platform_launch*'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/acceptance/**'
      - 'scripts/project_quota_probe_test.py'
      - '.github/workflows/app-project-quota-probe.yml'
  push:
    branches: [main]
    paths:
      - 'internal/apprunner/data/**'
      - 'internal/apprunner/driver/**'
      - 'internal/apprunner/journal/**'
      - 'internal/apprunner/transport/**'
      - 'internal/app/app_platform_data*'
      - 'internal/app/app_platform_managed_*'
      - 'internal/app/app_platform_candidate*'
      - 'internal/app/app_platform_readiness*'
      - 'internal/appplatform/backend_readiness*'
      - 'internal/appplatform/backend_registration*'
      - 'internal/app/app_platform_backend_identity*'
      - 'internal/app/app_platform_install_stage*'
      - 'internal/app/app_platform_install_worker*'
      - 'internal/app/app_platform_install_queue*'
      - 'internal/app/app_platform_install_scheduler*'
      - 'internal/app/app_platform_install_service*'
      - 'internal/app/app_platform_lease*'
      - 'internal/app/app_platform_install_review*'
      - 'internal/app/app_platform_release*'
      - 'internal/app/app_platform_actor*'
      - 'internal/app/app_platform_trust*'
      - 'internal/app/app_platform_install_audience*'
      - 'internal/app/app_platform_activation*'
      - 'internal/app/app_platform_frontend*'
      - 'internal/app/app_platform_install_profile*'
      - 'internal/app/app_platform_launch*'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/acceptance/**'
      - 'scripts/project_quota_probe_test.py'
      - '.github/workflows/app-project-quota-probe.yml'
permissions:
  contents: read
concurrency:
  group: app-project-quota-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  enforce-disposable-project-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ephemeral filesystem acceptance tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs xfslibs-dev
      - name: Build native data and independent UAPI probes
        run: |
          GOWORK=off GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-data-native.test" ./internal/apprunner/data
          GOWORK=off GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-driver-native.test" ./internal/apprunner/driver
          GOWORK=off GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-journal-native.test" ./internal/apprunner/journal
          GOWORK=off GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-transport-native.test" ./internal/apprunner/transport
          GOWORK=off GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/portal-data-native.test" ./internal/app
          GOWORK=off GOMAXPROCS=2 go test -race -p 2 ./internal/apprunner/transport ./internal/apprunner/driver
          cc -Wall -Wextra -Werror scripts/acceptance/xfs_abi_probe.c scripts/acceptance/xfs_identity_abi_probe.c -o "$RUNNER_TEMP/xfs-abi-probe"
          "$RUNNER_TEMP/xfs-abi-probe" > "$RUNNER_TEMP/xfs-abi.json"
          docker pull registry.k8s.io/pause:3.10
          candidate_image=$(docker image inspect registry.k8s.io/pause:3.10 --format '{{index .RepoDigests 0}}')
          test -n "$candidate_image"
          candidate_socket=$(readlink -f /var/run/docker.sock)
          {
            echo "APP_CANDIDATE_NATIVE_BINARY=$RUNNER_TEMP/app-driver-native.test"
            echo "APP_CANDIDATE_NATIVE_IMAGE=$candidate_image"
            echo "APP_CANDIDATE_DOCKER_SOCKET=$candidate_socket"
          } >> "$GITHUB_ENV"
      - name: Check refusal behavior without privileges
        run: python3 -B -m unittest discover -s scripts -p project_quota_probe_test.py
      - name: Build owned readiness backend through disposable local registry
        run: bash scripts/acceptance/ready_app/build-fixture.sh
      - name: Enforce quotas only on the newly owned loopback image
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,APP_CANDIDATE_NATIVE_BINARY,APP_CANDIDATE_NATIVE_IMAGE,APP_CANDIDATE_DOCKER_SOCKET,APP_READY_NATIVE_IMAGE python3 scripts/acceptance/project_quota_probe.py --disposable-github-worker --native-binary "$RUNNER_TEMP/app-data-native.test" --abi-json "$RUNNER_TEMP/xfs-abi.json" --journal-binary "$RUNNER_TEMP/app-journal-native.test" --transport-binary "$RUNNER_TEMP/app-transport-native.test" --portal-binary "$RUNNER_TEMP/portal-data-native.test" | tee project-quota-evidence.json
      - name: Remove only the owned readiness registry
        if: always()
        run: bash scripts/acceptance/ready_app/cleanup-fixture.sh
      - name: Preserve redacted enforcement evidence
        uses: actions/upload-artifact@v7
        with:
          name: project-quota-evidence
          path: project-quota-evidence.json
          if-no-files-found: error
          retention-days: 14
