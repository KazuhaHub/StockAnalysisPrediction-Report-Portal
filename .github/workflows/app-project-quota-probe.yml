name: app project quota probe
on:
  pull_request:
    paths:
      - 'scripts/acceptance/**'
      - 'scripts/project_quota_probe_test.py'
      - '.github/workflows/app-project-quota-probe.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/acceptance/**'
      - 'scripts/project_quota_probe_test.py'
      - '.github/workflows/app-project-quota-probe.yml'
permissions:
  contents: read
concurrency:
  group: app-project-quota-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  enforce-disposable-project-quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install ephemeral filesystem acceptance tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs
      - name: Check refusal behavior without privileges
        run: python3 -B -m unittest discover -s scripts -p project_quota_probe_test.py
      - name: Enforce quotas only on the newly owned loopback image
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/acceptance/project_quota_probe.py --disposable-github-worker | tee project-quota-evidence.json
      - name: Preserve redacted enforcement evidence
        uses: actions/upload-artifact@v7
        with:
          name: project-quota-evidence
          path: project-quota-evidence.json
          if-no-files-found: error
          retention-days: 14
