name: app runner daemon probe
on:
  pull_request:
    paths:
      - 'internal/apprunner/**'
      - 'cmd/app-runner/**'
      - '.github/workflows/app-runner-probe.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/apprunner/**'
      - 'cmd/app-runner/**'
      - '.github/workflows/app-runner-probe.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
concurrency:
  group: app-runner-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  inspect-disposable-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Inspect only the ephemeral worker daemon
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          probe_socket=$(readlink -f /var/run/docker.sock)
          test -S "$probe_socket"
          export PORTAL_APP_RUNNER_ACCEPTANCE_SOCKET="$probe_socket"
          go test -p 2 -race -count=1 -v ./internal/apprunner/driver ./cmd/app-runner
          go run ./cmd/app-runner inspect-daemon --socket "$probe_socket"
