name: app runner daemon probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/apprunner/**'
      - 'internal/app/app_platform_runtime*'
      - 'internal/app/app_platform_actor*'
      - 'internal/app/secretbox*'
      - 'cmd/app-runner/**'
      - 'deploy/app-runner/**'
      - 'docker-compose.yml'
      - 'Dockerfile.app-runner'
      - 'scripts/probe-compose-runner.sh'
      - 'scripts/probe-runner-image.sh'
      - '.github/workflows/app-runner-probe.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/apprunner/**'
      - 'internal/app/app_platform_runtime*'
      - 'internal/app/app_platform_actor*'
      - 'internal/app/secretbox*'
      - 'cmd/app-runner/**'
      - 'deploy/app-runner/**'
      - 'docker-compose.yml'
      - 'Dockerfile.app-runner'
      - 'scripts/probe-compose-runner.sh'
      - 'scripts/probe-runner-image.sh'
      - '.github/workflows/app-runner-probe.yml'
      - 'go.mod'
      - 'go.sum'
permissions:
  contents: read
concurrency:
  group: app-runner-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Runs natively on amd64 and on arm64 (doc 182 phase P2, decision D9: native arm64 evidence before Apple
  # Silicon guests are supported); the arm64 copy is the inspect-disposable-daemon-arm64 job.
  inspect-disposable-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps: &inspect_steps
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify runner contracts and inspect the ephemeral daemon
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          probe_socket=$(readlink -f /var/run/docker.sock)
          test -S "$probe_socket"
          export PORTAL_APP_RUNNER_ACCEPTANCE_SOCKET="$probe_socket"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          docker pull docker.io/library/busybox:1.37.0
          probe_digest=$(docker image inspect docker.io/library/busybox:1.37.0 --format '{{index .RepoDigests 0}}')
          test -n "$probe_digest"
          probe_image="docker.io/library/busybox@${probe_digest##*@}"
          export PORTAL_APP_RUNNER_ACCEPTANCE_IMAGE="$probe_image"
          echo "PORTAL_APP_RUNNER_ACCEPTANCE_IMAGE=$probe_image" >> "$GITHUB_ENV"
          go test -p 2 -race -count=1 -v ./internal/apprunner/... ./cmd/app-runner
          go run ./cmd/app-runner inspect-daemon --socket "$probe_socket"

      - name: Verify explicit bootstrap and fail-closed service startup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          test "$(sed -n 's/^RP_APP_RUNNER_SOCKET=//p' deploy/app-runner/portal.env.example)" = \
            "$(jq -r .control_socket deploy/app-runner/service.example.json)"
          root=$(mktemp -d /tmp/portal-runner-bootstrap.XXXXXXXX)
          work=$(mktemp -d "$RUNNER_TEMP/portal-runner-keys.XXXXXXXX")
          trap 'sudo -n rm -rf "$root"; rm -rf "$work"' EXIT
          sudo -n chown root:root "$root"
          sudo -n chmod 0700 "$root"
          journal="$root/journal"
          data="$root/data"
          checkpoints="$root/checkpoints"
          images="$root/images"
          ipc="$root/ipc"
          control="$root/control"
          sudo -n install -d -m 0700 -o root -g root "$journal" "$data" "$checkpoints" "$images" "$ipc"
          sudo -n install -d -m 0750 -o root -g root "$control"
          runner="$RUNNER_TEMP/app-runner-service"
          go build -o "$runner" ./cmd/app-runner
          openssl genpkey -algorithm ED25519 -out "$work/controller-private.pem"
          openssl pkey -in "$work/controller-private.pem" -pubout -outform DER | tail -c 32 > "$work/controller-public.raw"
          public=$(base64 -w0 "$work/controller-public.raw" | tr '+/' '-_' | tr -d '=')
          fingerprint=$(sha256sum "$work/controller-public.raw" | awk '{print $1}')
          jq -n \
            --arg journal "$journal" \
            --arg public "$public" \
            --arg fingerprint "$fingerprint" \
            '{
              format:"portal.app-runner.bootstrap/1-dev.1",
              journal_dir:$journal,
              controller_public_key:$public,
              controller:{
                deployment_id:"10000000-0000-4000-8000-000000000001",
                controller_epoch:"20000000-0000-4000-8000-000000000002",
                control_revision:1,
                fingerprint:$fingerprint
              }
            }' | sudo -n tee "$root/bootstrap.json" >/dev/null
          jq -n \
            --arg journal "$journal" \
            --arg data "$data" \
            --arg checkpoints "$checkpoints" \
            --arg images "$images" \
            --arg ipc "$ipc" \
            --arg control_root "$control" \
            --arg control "$control/runner.sock" \
            --arg fingerprint "$fingerprint" \
            '{
              format:"portal.app-runner.config/1-dev.1",
              docker_socket:"/run/docker.sock",
              journal_dir:$journal,
              data_root:$data,
              checkpoint_root:$checkpoints,
              image_root:$images,
              allow_local_reference_images:true,
              ipc_root:$ipc,
              control_root:$control_root,
              control_socket:$control,
              controller_uid:41001,
              controller_gid:41001,
              network_active:4,
              network_entries:32,
              minimum_reported_cpus:2,
              minimum_reported_memory_bytes:2147483648,
              controller:{
                deployment_id:"10000000-0000-4000-8000-000000000001",
                controller_epoch:"20000000-0000-4000-8000-000000000002",
                control_revision:1,
                fingerprint:$fingerprint
              }
            }' | sudo -n tee "$root/service.json" >/dev/null
          sudo -n chown root:root "$root/bootstrap.json" "$root/service.json"
          sudo -n chmod 0600 "$root/bootstrap.json" "$root/service.json"
          first=$(sudo -n "$runner" bootstrap --config "$root/bootstrap.json")
          test "$(jq -r .created <<<"$first")" = true
          second=$(sudo -n "$runner" bootstrap --config "$root/bootstrap.json")
          test "$(jq -r .created <<<"$second")" = false
          test ! -s "$control/runner.sock"
          if serve_output=$(sudo -n "$runner" serve --config "$root/service.json" 2>&1); then
            echo "service started on a non-XFS fixture" >&2
            exit 1
          fi
          # The fixture root is on the worker's ext4: the refusal says so, names the recipe and never a path, and
          # still ends with the fixed refusal line.
          test "$(printf '%s\n' "$serve_output" | tail -n 1)" = "runner service is not ready"
          printf '%s\n' "$serve_output" | grep -q 'data_root is on ext4'
          printf '%s\n' "$serve_output" | grep -q 'provision-xfs-images'
          if printf '%s\n' "$serve_output" | grep -q "$root"; then
            echo "the refusal leaked a configured path" >&2
            exit 1
          fi

      - name: Start the managed service on an owned XFS project-quota mount
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs
          root=$(mktemp -d /tmp/portal-runner-service.XXXXXXXX)
          service_root=/run/portal-app-runner-service
          image="$root/owned.xfs"
          mountpoint="$root/mount"
          loop=
          service_pid=
          work=$(mktemp -d "$RUNNER_TEMP/portal-runner-service-keys.XXXXXXXX")
          cleanup() {
            if [ -n "$service_pid" ]; then
              sudo -n kill -TERM "$service_pid" 2>/dev/null || true
              for _ in $(seq 1 50); do
                sudo -n kill -0 "$service_pid" 2>/dev/null || break
                sleep 0.1
              done
              sudo -n kill -KILL "$service_pid" 2>/dev/null || true
              wait "$service_pid" 2>/dev/null || true
            fi
            if [ -n "$loop" ]; then
              sudo -n umount "$mountpoint" 2>/dev/null || true
              sudo -n losetup --detach "$loop" 2>/dev/null || true
            fi
            sudo -n rm -rf "$root" "$service_root"
            rm -rf "$work"
          }
          trap cleanup EXIT
          # Sparse: the runner reports not ready on a volume smaller than its declared disk budget (8 GiB by
          # default), so the service volume is larger than the 1 GiB the quota probes use.
          truncate -s 9G "$image"
          loop=$(sudo -n losetup --find --show "$image")
          test -n "$loop"
          sudo -n mkfs.xfs -f "$loop" >/dev/null
          sudo -n install -d -m 0700 -o root -g root "$mountpoint" "$root/journal"
          sudo -n mount -t xfs -o prjquota,nodev,nosuid,noexec "$loop" "$mountpoint"
          sudo -n install -d -m 0700 -o root -g root "$mountpoint/data" "$mountpoint/checkpoints" "$mountpoint/images"
          sudo -n install -d -m 0750 -o root -g 41001 "$service_root"
          sudo -n install -d -m 0750 -o root -g 41001 "$service_root/control"
          sudo -n install -d -m 0700 -o root -g root "$service_root/ipc"
          sudo -n chown root:root "$root"
          sudo -n chmod 0700 "$root"
          runner="$RUNNER_TEMP/app-runner-service-live"
          observer="$RUNNER_TEMP/app-runner-service-observer"
          go build -o "$runner" ./cmd/app-runner
          GOWORK=off GOMAXPROCS=2 go test -c -o "$observer" ./internal/apprunner/service
          chmod 0555 "$runner" "$observer"
          openssl genpkey -algorithm ED25519 -out "$work/controller-private.pem"
          openssl pkey -in "$work/controller-private.pem" -pubout -outform DER | tail -c 32 > "$work/controller-public.raw"
          public=$(base64 -w0 "$work/controller-public.raw" | tr '+/' '-_' | tr -d '=')
          fingerprint=$(sha256sum "$work/controller-public.raw" | awk '{print $1}')
          deployment=10000000-0000-4000-8000-000000000001
          epoch=20000000-0000-4000-8000-000000000002
          jq -n \
            --arg journal "$root/journal" \
            --arg public "$public" \
            --arg fingerprint "$fingerprint" \
            --arg deployment "$deployment" \
            --arg epoch "$epoch" \
            '{
              format:"portal.app-runner.bootstrap/1-dev.1",
              journal_dir:$journal,
              controller_public_key:$public,
              controller:{deployment_id:$deployment,controller_epoch:$epoch,control_revision:1,fingerprint:$fingerprint}
            }' | sudo -n tee "$root/bootstrap.json" >/dev/null
          jq -n \
            --arg journal "$root/journal" \
            --arg data "$mountpoint/data" \
            --arg checkpoints "$mountpoint/checkpoints" \
            --arg images "$mountpoint/images" \
            --arg socket "$service_root/control/runner.sock" \
            --arg fingerprint "$fingerprint" \
            --arg deployment "$deployment" \
            --arg epoch "$epoch" \
            --arg docker "$(readlink -f /var/run/docker.sock)" \
            '{
              format:"portal.app-runner.config/1-dev.1",
              docker_socket:$docker,
              journal_dir:$journal,
              data_root:$data,
              checkpoint_root:$checkpoints,
              image_root:$images,
              allow_local_reference_images:true,
              ipc_root:"/run/portal-app-runner-service/ipc",
              control_root:"/run/portal-app-runner-service/control",
              control_socket:$socket,
              controller_uid:41001,
              controller_gid:41001,
              network_active:1,
              network_entries:16,
              minimum_reported_cpus:1,
              minimum_reported_memory_bytes:536870912,
              controller:{deployment_id:$deployment,controller_epoch:$epoch,control_revision:1,fingerprint:$fingerprint}
            }' | sudo -n tee "$root/service.json" >/dev/null
          sudo -n chown root:root "$root/bootstrap.json" "$root/service.json"
          sudo -n chmod 0600 "$root/bootstrap.json" "$root/service.json"
          sudo -n "$runner" bootstrap --config "$root/bootstrap.json" >/dev/null
          start_service() {
            sudo -n sh -c 'exec "$1" serve --config "$2" >"$3" 2>&1' sh \
              "$runner" "$root/service.json" "$root/service.log" &
            service_pid=$!
            for _ in $(seq 1 100); do
              sudo -n test -S "$service_root/control/runner.sock" && return 0
              sudo -n kill -0 "$service_pid" 2>/dev/null || {
                sudo -n cat "$root/service.log"
                return 1
              }
              sleep 0.1
            done
            return 1
          }
          stop_service() {
            sudo -n kill -TERM "$service_pid"
            wait "$service_pid"
            service_pid=
            sudo -n test ! -e "$service_root/control/runner.sock"
          }
          observe_service() {
            sudo -n env -i \
              PATH=/usr/bin:/bin \
              GITHUB_ACTIONS=true \
              RUNNER_ENVIRONMENT=github-hosted \
              GOARCH="$(go env GOARCH)" \
              PORTAL_APP_RUNNER_SERVICE_ACCEPTANCE=1 \
              PORTAL_APP_RUNNER_SERVICE_UID=41001 \
              PORTAL_APP_RUNNER_SERVICE_GID=41001 \
              PORTAL_APP_RUNNER_SERVICE_SOCKET="$service_root/control/runner.sock" \
              PORTAL_APP_RUNNER_SERVICE_PUBLIC_KEY="$public" \
              PORTAL_APP_RUNNER_SERVICE_DEPLOYMENT_ID="$deployment" \
              PORTAL_APP_RUNNER_SERVICE_CONTROLLER_EPOCH="$epoch" \
              PORTAL_APP_RUNNER_SERVICE_FINGERPRINT="$fingerprint" \
              setpriv --reuid=41001 --regid=41001 --clear-groups --no-new-privs \
              "$observer" -test.v -test.timeout=20s -test.run='^TestNativeManagedServiceProfile$'
          }
          start_service
          observe_service | sudo -n tee "$root/observer-first.log"
          sudo -n grep -q NATIVE_MANAGED_SERVICE_PROFILE_VERIFIED "$root/observer-first.log"
          stop_service
          start_service
          observe_service | sudo -n tee "$root/observer-second.log"
          sudo -n grep -q NATIVE_MANAGED_SERVICE_PROFILE_VERIFIED "$root/observer-second.log"
          stop_service
          sudo -n grep -q 'app-runner ready profile=linux-docker-rootful-projectquota/v1-dev platform=linux/' "$root/service.log"
          # With 4 or more CPUs the default reserves one, so the line must show a real reservation, not the
          # reserved_cpus=none app_cpus=all of a host that reserves nothing.
          if [ "$(nproc --all)" -ge 4 ]; then
            sudo -n grep -Eq 'app-runner ready .* capacity=.* reserved_cpus=0 app_cpus=[0-9]' "$root/service.log"
          else
            sudo -n grep -Eq 'app-runner ready .* capacity=.* reserved_cpus=[^ ]+ app_cpus=[^ ]+ ' "$root/service.log"
          fi

      - name: Verify closed candidate container policy on the disposable daemon
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          probe_socket=$(readlink -f /var/run/docker.sock)
          docker pull registry.k8s.io/pause:3.10
          lifecycle_image=$(docker image inspect registry.k8s.io/pause:3.10 --format '{{index .RepoDigests 0}}')
          test -n "$lifecycle_image"
          container_binary=$(mktemp "$RUNNER_TEMP/container-policy.XXXXXXXX")
          trap 'rm -f "$container_binary"' EXIT
          go test -p 2 -race -c -o "$container_binary" ./internal/apprunner/driver
          chmod 0500 "$container_binary"
          cd internal/apprunner/driver
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PORTAL_APP_RUNNER_CONTAINER_ACCEPTANCE=1 PORTAL_APP_RUNNER_ACCEPTANCE_SOCKET="$probe_socket" PORTAL_APP_RUNNER_ACCEPTANCE_IMAGE="$PORTAL_APP_RUNNER_ACCEPTANCE_IMAGE" PORTAL_APP_RUNNER_LIFECYCLE_IMAGE="$lifecycle_image" "$container_binary" -test.v -test.timeout=120s -test.run='^(TestDockerAcceptanceCandidate(Container|Lifecycle|InventoryReconciliation)|TestNativeCandidateMountPins.*)$'

      - name: Verify the service broker socket through a read-only mount
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          build=$(mktemp "$RUNNER_TEMP/service-broker.XXXXXXXX")
          # The test re-executes its binary as the application's user (65532), which cannot traverse the runner's
          # home, so the binary runs from a root-owned directory every user can traverse.
          bin_dir=$(sudo -n mktemp -d /tmp/service-broker.XXXXXXXX)
          trap 'rm -f "$build"; sudo -n rm -rf "$bin_dir"' EXIT
          go test -p 2 -race -c -o "$build" ./internal/apprunner/driver
          sudo -n chmod 0755 "$bin_dir"
          sudo -n install -m 0555 -o root -g root "$build" "$bin_dir/driver.test"
          cd internal/apprunner/driver
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PORTAL_APP_RUNNER_CONTAINER_ACCEPTANCE=1 "$bin_dir/driver.test" -test.v -test.timeout=90s -test.run='^TestNativeServiceBrokerSocketInPinnedDir$'

      - name: Verify distinct controller and runner identities in isolation
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          identity_binary=$(mktemp "$RUNNER_TEMP/runner-identity.XXXXXXXX")
          trap 'rm -f "$identity_binary"' EXIT
          go test -p 2 -race -c -o "$identity_binary" ./internal/apprunner/transport
          chmod 0500 "$identity_binary"
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PORTAL_APP_RUNNER_IDENTITY_ACCEPTANCE=1 "$identity_binary" -test.v -test.timeout=90s -test.run='^TestControllerIdentityAcceptance$'

      - name: Verify background broker egress through the root endpoint
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          build=$(mktemp "$RUNNER_TEMP/runner-egress.XXXXXXXX")
          # The test re-executes its binary as the application's user (65532), which cannot traverse the runner's
          # home, so the binary runs from a root-owned directory every user can traverse.
          bin_dir=$(sudo -n mktemp -d /tmp/runner-egress.XXXXXXXX)
          trap 'rm -f "$build"; sudo -n rm -rf "$bin_dir"' EXIT
          go test -p 2 -race -c -o "$build" ./internal/apprunner/transport
          sudo -n chmod 0755 "$bin_dir"
          sudo -n install -m 0555 -o root -g root "$build" "$bin_dir/transport.test"
          cd internal/apprunner/transport
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PORTAL_APP_RUNNER_EGRESS_ACCEPTANCE=1 "$bin_dir/transport.test" -test.v -test.timeout=90s -test.run='^(TestServiceEgressEndpointAcceptance|TestProxyEndpointAcceptance)$'

      - name: Verify Portal confirmation through the root endpoint
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          portal_binary=$(mktemp "$RUNNER_TEMP/portal-confirm.XXXXXXXX")
          trap 'rm -f "$portal_binary"' EXIT
          go test -p 2 -race -c -o "$portal_binary" ./internal/app
          chmod 0500 "$portal_binary"
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PORTAL_RUNTIME_CONFIRM_ACCEPTANCE=1 "$portal_binary" -test.v -test.timeout=90s -test.run='^TestPlatformRuntimeEndpointAcceptance$'

  # Doc 187 section 11: the compose runner, natively, on the worker (rootful Docker, privileged containers in the
  # host namespaces are what this exercises). The image is built here from the commit and never pushed: host-setup
  # plan and --apply through `docker compose run`, a second --apply, a refused conflict, `up -d`, the startup
  # checks and the managed profile observed as the controller UID, restart, a killed runner and its stale socket,
  # `down`, health with the runner stopped, and a simulated reboot. It also runs the image's own entry checks
  # (scripts/probe-runner-image.sh) as the release does; the release workflow runs them again on both architectures
  # by digest before anything is recorded.
  compose-runner-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the host tools host-setup needs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs
      - name: Build the runner image and the observer
        shell: bash
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p bin/linux-amd64
          go build -trimpath -o bin/linux-amd64/app-runner ./cmd/app-runner
          docker build --build-arg TARGETARCH=amd64 -f Dockerfile.app-runner -t app-runner-probe:local .
          GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-runner-observer" ./internal/apprunner/service
          chmod 0555 "$RUNNER_TEMP/app-runner-observer"
      # The release workflow's pre-push check, as it runs there: the unprivileged runner user, no sudo. Without this
      # the probe ran only during a release, and v2026.47.2 stopped at it.
      - name: Run the image entry probe as the release does
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sh scripts/probe-runner-image.sh app-runner-probe:local linux/amd64
      - name: Run the compose lifecycle probe
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n sh scripts/probe-compose-runner.sh app-runner-probe:local "$RUNNER_TEMP/app-runner-observer"

  # The same steps natively on arm64. A separate job rather than a runner matrix: runs-on stays a literal
  # GitHub-hosted label (capacity_soak_test.WorkflowHostGuardTests).
  inspect-disposable-daemon-arm64:
    # Not on a pull request: the amd64 leg is the pull request's check; arm64 runs on main and by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps: *inspect_steps

  # Doc 182 section 3.2 / phases P0-P1: the provisioning command on an ext4 outer filesystem. A small ext4 image
  # stands in for the host's ext4 /data (mkfs -m 0, so it can really be filled), the command makes two preallocated
  # loop-mounted XFS images on it, and the evidence is: the runner's own data-root checks pass (the command
  # runs them), a rerun is idempotent, foreign content is refused, a full outer filesystem leaves the images
  # writable and their project quota native, the filesystems are repair-clean, and a reattached image keeps its
  # limit. The doc 28 workload table itself stays in app-project-quota-probe.yml. The power-cut test needs a VM
  # and is not run here.
  provision-xfs-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: &provision_steps
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Provision, fill the outer filesystem, repair-check and reattach
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs e2fsprogs
          # Root-owned: the command requires every directory above an image or mount point to be root-owned.
          work=$(sudo -n mktemp -d /tmp/portal-provision.XXXXXXXX)
          sudo -n chmod 0755 "$work"
          logs=$(mktemp -d "$RUNNER_TEMP/portal-provision-logs.XXXXXXXX")
          outer="$work/outer"
          portal="$outer/portal"
          data_mount="$portal/mnt-data"
          checkpoint_mount="$portal/mnt-checkpoint"
          outer_loop=
          detach_associated() {
            local loop
            for loop in $(sudo -n losetup --associated "$1" --noheadings --output NAME 2>/dev/null || true); do
              sudo -n losetup --detach "$loop" || true
            done
          }
          cleanup() {
            sudo -n umount "$data_mount" 2>/dev/null || true
            sudo -n umount "$checkpoint_mount" 2>/dev/null || true
            detach_associated "$portal/data.img"
            detach_associated "$portal/checkpoint.img"
            sudo -n umount "$outer" 2>/dev/null || true
            if [ -n "$outer_loop" ]; then sudo -n losetup --detach "$outer_loop" 2>/dev/null || true; fi
            sudo -n rm -rf "$work"
            rm -rf "$logs"
          }
          trap cleanup EXIT
          runner="$RUNNER_TEMP/app-runner-provision"
          go build -o "$runner" ./cmd/app-runner
          # The stand-in host filesystem: ext4 with no reserved blocks, so "full" really means full.
          sudo -n truncate -s 10G "$work/outer.img"
          outer_loop=$(sudo -n losetup --find --show "$work/outer.img")
          sudo -n mkfs.ext4 -q -m 0 "$outer_loop"
          sudo -n install -d -m 0755 "$outer"
          sudo -n mount -t ext4 "$outer_loop" "$outer"
          sudo -n install -d -m 0700 -o root -g root "$portal"
          provision() {
            sudo -n "$runner" provision-xfs-images \
              --data-image "$portal/data.img" --data-size 2G \
              --checkpoint-image "$portal/checkpoint.img" --checkpoint-size 2G \
              --mount-data "$data_mount" --mount-checkpoint "$checkpoint_mount" "$@"
          }

          echo "::group::dry run changes nothing"
          provision --dry-run | tee "$logs/dry.log"
          sudo -n test ! -e "$portal/data.img"
          echo "::endgroup::"

          echo "::group::foreign content is refused before anything is made"
          sudo -n install -d -m 0700 "$portal/junk"
          sudo -n touch "$portal/junk/keep"
          # The log belongs to the job user, so the redirect deliberately runs without sudo.
          # shellcheck disable=SC2024
          if sudo -n "$runner" provision-xfs-images \
              --data-image "$portal/data.img" --data-size 2G \
              --checkpoint-image "$portal/checkpoint.img" --checkpoint-size 2G \
              --mount-data "$portal/junk" --mount-checkpoint "$checkpoint_mount" > "$logs/refused.log" 2>&1; then
            echo "a non-empty mount point was accepted" >&2
            exit 1
          fi
          grep -q '^refused: data volume' "$logs/refused.log"
          sudo -n test ! -e "$portal/data.img"
          sudo -n test -e "$portal/junk/keep"
          echo "::endgroup::"

          echo "::group::provision"
          provision | tee "$logs/provision.log"
          grep -q '"data_root": "'"$data_mount"'/root"' "$logs/provision.log"
          grep -q "$portal/data.img $data_mount xfs loop,prjquota,nodev,nosuid,noexec,nofail,X-fstrim.notrim 0 0" "$logs/provision.log"
          for image in data checkpoint; do
            # Preallocated, not sparse: allocated bytes cover the whole size.
            size=$(sudo -n stat -c %s "$portal/$image.img")
            blocks=$(sudo -n stat -c %b "$portal/$image.img")
            test "$size" = 2147483648
            test $((blocks * 512)) -ge "$size"
            test "$(sudo -n stat -c %a "$portal/$image.img")" = 600
          done
          for mount in "$data_mount" "$checkpoint_mount"; do
            test "$(sudo -n findmnt -no FSTYPE "$mount")" = xfs
            sudo -n findmnt -no OPTIONS "$mount" | grep -q prjquota
            test "$(sudo -n stat -c %a "$mount/root")" = 700
          done
          # Direct I/O on the loop device, as the recipe attaches it.
          sudo -n losetup --list --output NAME,DIO,BACK-FILE | grep "$portal/data.img" | awk '{ exit ($2 != 1) }'
          echo "::endgroup::"

          echo "::group::a rerun only reverifies"
          before=$(sudo -n losetup --list --noheadings | wc -l)
          provision | tee "$logs/rerun.log"
          test "$(grep -c already-provisioned "$logs/rerun.log")" = 2
          test "$(sudo -n losetup --list --noheadings | wc -l)" = "$before"
          echo "::endgroup::"

          echo "::group::project quota is native, also with the outer filesystem full"
          sudo -n mkdir "$data_mount/root/app"
          sudo -n xfs_quota -x -c "project -s -p $data_mount/root/app 4242" "$data_mount"
          sudo -n xfs_quota -x -c "limit -p bhard=8m ihard=64 4242" "$data_mount"
          avail=$(sudo -n df --output=avail -B1 "$outer" | tail -n 1 | tr -d ' ')
          # Leave a little for the fill file's own extent blocks, then take the rest, so the outer filesystem is full.
          sudo -n fallocate -l $((avail - 524288)) "$outer/fill.bin"
          sudo -n dd if=/dev/zero of="$outer/fill.tail" bs=4k status=none 2>/dev/null || true
          test "$(sudo -n df --output=avail -B1 "$outer" | tail -n 1 | tr -d ' ')" -lt 4096
          # The preallocated image does not need a block from the full outer filesystem.
          sudo -n dd if=/dev/zero of="$data_mount/root/preallocated.bin" bs=1M count=64 conv=fsync status=none
          if sudo -n dd if=/dev/zero of="$data_mount/root/app/over.bin" bs=1M count=16 conv=fsync 2> "$logs/dd.err"; then
            echo "the project quota did not hold" >&2
            exit 1
          fi
          grep -q 'No space left on device' "$logs/dd.err"
          test "$(sudo -n stat -c %s "$data_mount/root/app/over.bin")" -le 8388608
          sudo -n rm -f "$data_mount/root/preallocated.bin"
          echo "::endgroup::"

          echo "::group::repair-check, then reattach keeps the limit"
          sudo -n umount "$data_mount"
          sudo -n umount "$checkpoint_mount"
          for image in data checkpoint; do
            loop=$(sudo -n losetup --associated "$portal/$image.img" --noheadings --output NAME)
            sudo -n xfs_repair -n "$loop"
            sudo -n losetup --detach "$loop"
          done
          sudo -n rm -f "$outer/fill.bin" "$outer/fill.tail"
          provision | tee "$logs/reattach.log"
          test "$(grep -c 'attached image' "$logs/reattach.log")" = 2
          sudo -n xfs_quota -x -c 'report -p -b -N' "$data_mount" | awk '$1 == "#4242" { found = 1; exit ($4 != 8192) } END { exit !found }'
          echo "::endgroup::"

  # The same steps natively on arm64. A separate job rather than a runner matrix: runs-on stays a literal
  # GitHub-hosted label (capacity_soak_test.WorkflowHostGuardTests).
  provision-xfs-images-arm64:
    # Not on a pull request: the amd64 leg is the pull request's check; arm64 runs on main and by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps: *provision_steps

  # Doc 182 phase P2 / decision D9: the doc 28, 46 and 49 native workload (project quota, root identity, journal
  # and transport on an owned XFS loop volume) executed natively on arm64. The amd64 evidence is
  # app-project-quota-probe.yml, whose browser and image-delivery fixtures are amd64-only and are not repeated
  # here; the doc 146 service workflow runs on arm64 in the inspect-disposable-daemon-arm64 leg above. Evidence,
  # not a gate on its own: until this job has passed on arm64, Apple Silicon guests stay unsupported.
  native-quota-evidence-arm64:
    # Not on a pull request: the amd64 leg is the pull request's check; arm64 runs on main and by hand.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install ephemeral filesystem acceptance tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xfsprogs xfslibs-dev iproute2 util-linux
      - name: Build native probes and run the quota probe on the owned loop volume
        shell: bash
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-data-native.test" ./internal/apprunner/data
          GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-journal-native.test" ./internal/apprunner/journal
          GOMAXPROCS=2 go test -c -o "$RUNNER_TEMP/app-transport-native.test" ./internal/apprunner/transport
          cc -Wall -Wextra -Werror scripts/acceptance/xfs_abi_probe.c scripts/acceptance/xfs_identity_abi_probe.c -o "$RUNNER_TEMP/xfs-abi-probe"
          "$RUNNER_TEMP/xfs-abi-probe" > "$RUNNER_TEMP/xfs-abi.json"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/acceptance/project_quota_probe.py \
            --disposable-github-worker \
            --native-binary "$RUNNER_TEMP/app-data-native.test" \
            --abi-json "$RUNNER_TEMP/xfs-abi.json" \
            --journal-binary "$RUNNER_TEMP/app-journal-native.test" \
            --transport-binary "$RUNNER_TEMP/app-transport-native.test" | tee project-quota-evidence-arm64.json
          test "$(jq -r .architecture project-quota-evidence-arm64.json)" = aarch64
      - name: Preserve redacted arm64 enforcement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-quota-evidence-arm64
          path: project-quota-evidence-arm64.json
          if-no-files-found: warn
          retention-days: 14
  # Also runs, as root on a real daemon, the overlap checks that need privilege: a bind-backed local volume of a
  # namespace must conflict, and real bind mounts of the namespace, its parent and a descendant must be seen in
  # the mount table (TestBindMountAliasIsAnOverlap, which skips without root).
  foreign-container-beside-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same service the capacity soak declared: a database container the runner did not start.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: reports_soak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d reports_soak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Record what the daemon reports about the service container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foreign"
          sock=$(readlink -f /var/run/docker.sock)
          sudo curl -sSf --unix-socket "$sock" 'http://localhost/v1.47/containers/json?all=1' | tee "$RUNNER_TEMP/foreign/containers.json" > /dev/null
          jq -c '.[] | {Id, Image, Mounts}' "$RUNNER_TEMP/foreign/containers.json"
          # Select the service by its image, never by position, and keep only the fields the diagnosis needs: the
          # container's environment (the service password) is never stored.
          id=$(jq -er '[.[] | select(.Image == "postgres:16-alpine")][0].Id' "$RUNNER_TEMP/foreign/containers.json")
          sudo curl -sSf --unix-socket "$sock" "http://localhost/v1.47/containers/$id/json" | jq '{Id, Name, Mounts}' > "$RUNNER_TEMP/foreign/container-inspect.json"
          docker version --format '{{.Server.Version}} api {{.Server.APIVersion}}' | tee "$RUNNER_TEMP/foreign/docker-version.txt"
          # The overlap check reads the runner's mount table, so keep it with the payload.
          sudo cat /proc/self/mountinfo | tee "$RUNNER_TEMP/foreign/mountinfo.txt" > /dev/null
          sudo readlink /proc/self/root | tee "$RUNNER_TEMP/foreign/proc-self-root.txt"
      - name: Install the forwarder the peer identity test refuses
        run: command -v socat >/dev/null || sudo apt-get install -y --no-install-recommends socat
      - name: Run the writer's container inventory beside the service container
        env:
          GOWORK: 'off'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/driver-foreign.test" ./internal/apprunner/driver
          chmod 0500 "$RUNNER_TEMP/driver-foreign.test"
          sock=$(readlink -f /var/run/docker.sock)
          cd internal/apprunner/driver
          sudo -n env -i PATH=/usr/bin:/bin GOMAXPROCS=2 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            PORTAL_APP_RUNNER_FOREIGN_ACCEPTANCE=1 PORTAL_APP_RUNNER_ACCEPTANCE_SOCKET="$sock" \
            "$RUNNER_TEMP/driver-foreign.test" -test.v -test.timeout=60s \
            -test.run='^(TestDockerAcceptanceForeignContainerBesideDataWriterInventory|TestDockerAcceptanceBindBackedVolumeIsAConflict|TestBindMountAliasIsAnOverlap|TestDockerAcceptancePeerIdentity|TestInventory.*|TestPluginVolume.*|TestVolumeWith.*|TestPendingVolume.*|TestFailedInspect.*|TestLocalAnonymous.*)$' 2>&1 | tee "$RUNNER_TEMP/foreign/test.log"
      - name: Preserve the daemon payload and the test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foreign-container-payload
          path: ${{ runner.temp }}/foreign
          if-no-files-found: warn
          retention-days: 14
