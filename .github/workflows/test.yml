name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch replaces an older one, on pull requests and on main alike.
# Every PR already passed this workflow before merging, so a main run that a later merge
# supersedes adds nothing the later run will not check: that run covers the same changes, and
# the release guard requires a green run on the exact commit it tags, which is always the newest.
# Keeping every main run used to queue a full race suite per merge behind the account's
# concurrent-job limit (six back-to-back merges stretched a 4-minute run to ~10 minutes).
# Manual runs keep a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

# No go.work on the runner, and no silent toolchain download: the installed Go must satisfy the
# go directive exactly. (Adopted from Passwall-Sub-Panel's CI.)
env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

jobs:
  # WHICH JOBS A PULL REQUEST NEEDS, FROM THE FILES IT CHANGES. A docs-only pull request ran the
  # whole suite for 26 minutes; a web-only one ran every Go job. scripts/ci_changes.py sorts each
  # changed file into docs, web, Go or both (anything it does not know, and any file the other side
  # reads, is both), and the Go, web and docker jobs run only when their group is needed. A push to
  # main and a manual run always need everything: release_guard.wait_ci tags only a commit whose
  # push or manual run passed in full, so nothing here may skip there, and no path filter is put on
  # this workflow. The required checks stay the always() summary jobs, which pass a skipped group
  # only when this job said the pull request did not need it, and fail if this job did not succeed.
  # On a pull request HEAD is GitHub's merge commit, whose first parent is the base branch, so the
  # diff between the two is exactly what the pull request would merge.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      web: ${{ steps.classify.outputs.web }}
      platform: ${{ steps.classify.outputs.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Classify the changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != pull_request ]; then
            printf 'go=true\nweb=true\nplatform=true\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = 3 || { echo "::error::HEAD is not the pull request's merge commit"; exit 1; }
          # --no-renames lists a moved file under its old path too: a rename of a file the other side
          # reads would otherwise show only its new, harmless-looking path.
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          printf '%s\n' "$files" | python3 -B scripts/ci_changes.py | tee -a "$GITHUB_OUTPUT"

  # THE GO TESTS ARE FOUR KINDS OF JOB, AND TWO REQUIRED CHECKS. This job carries everything that
  # runs once: formatting, build, vet, staticcheck, govulncheck and every package except
  # internal/app. The app package's ordinary run is dealt over the go-test-shard jobs below, because
  # its PostgreSQL variants put it at 16 to 20 minutes on a runner. The required check "go-test" is
  # the summary job after them. There is no race lane on a pull request: the race detector runs on
  # pushes to main and on manual runs only, in the go-race-others and go-race-full jobs below.
  #
  # NO FOCUSED STEP RUNS AN internal/app TEST WITHOUT -race. Such steps used to sit here, 5.5 minutes
  # of the critical path, running tests the go-test shards already run with the same database: the
  # shards run every Test and Fuzz of the package. A test that must also run in some other way (a
  # flag, an environment variable) still gets its own step, as the published market does.
  go-test-checks:
    name: go test (checks + other packages)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Includes the focused SQL diagnostics and the ordinary full PostgreSQL run.
    # The latter now executes after the repaired vulnerability gate.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: reports_test
        ports:
          - 5432:5432
        # The data directory on tmpfs: a throwaway CI database needs no durability, and every
        # commit's fsync to the runner's disk is time the PostgreSQL variants spend waiting.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U portal -d reports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Enables the Postgres integration test (TestPostgresQueries); without this the
      # test skips. Verifies the real PG path: schema DDL, STRING_AGG, ILIKE search.
      TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v6
      # EACH GO JOB KEEPS ITS OWN BUILD CACHE, AND setup-go KEEPS NONE. setup-go's `cache: true`
      # stores one entry per toolchain and go.sum for every job in this file, and a key cannot be
      # written twice, so whichever job finished first owned it for all of them. That was workflow
      # lint, whose only Go work is compiling actionlint: every job restored its 24 MB and compiled
      # the rest from source (`go build` 34s and staticcheck 30s here, ~100s of each race shard's
      # step, 26-38s of docker-image's binary) on every run since go.sum last changed in #41.
      # Modules are left to the proxy: downloading all of them takes ~3s.
      #
      # RESTORED ON EVERY EVENT, SAVED ONLY FROM A MAIN PUSH. A save from a pull request is visible
      # only to later runs of that same PR, while a save from main is one every PR can read, so
      # main is the only place a save earns its upload. The save is the job's last step and
      # carries the implicit success(), so a run that failed writes nothing.
      #
      # THE KEY ENDS IN THE RUN ID, NOT AT go.sum. A key cannot be overwritten, so a go.sum key
      # would freeze at the first main push after a dependency change: at that commit's packages,
      # and at its toolchain, so a Go patch bump in go.mod would turn every entry into a miss that
      # nothing could replace until go.sum next moved. A key per run lets every main push leave
      # the newest cache for the next run to restore by prefix. Superseded keys are never read
      # again and age out of the repository's cache storage; what the newest key carries is
      # bounded by the trim before each save (below). A prefix restore is safe because the cache
      # is content-addressed: a stale entry is a miss, never a wrong build. staticcheck's
      # analysis cache rides along in this job's key.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # gofmt was a step in the release checklist, run by hand ("vet and gofmt"), and nothing here
      # enforced it. Passwall-Sub-Panel gates on it after an unformatted file passed its CI and
      # failed a sibling's instead; the same hands edit this tree. Under a second.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { printf '::error::gofmt -w would change:\n%s\n' "$unformatted"; exit 1; }
      - run: go build ./... # compile every package (fails fast on a build break)
      - run: go vet ./...
      # Besides its own test, this step compiles internal/app's test binary with the shards' flags,
      # which is what puts it into the cache this job saves for them.
      - name: Published application market
        run: go test ./internal/app -run '^TestCanonicalAppMarketPublishedInstall$' -count=1
        env:
          TEST_PUBLIC_APP_MARKET: "1"
      # Arch determinism: the release image is multi-arch and production may run the arm64 build, so
      # the forecast statistics' p-values and the queue priority score must be identical on every
      # architecture. Go contracts `a*b + c` into an FMA on arm64 (and GOAMD64>=v3 amd64) but not on
      # base amd64, and the two round differently. The barrier that forbids it is invisible to a test
      # on amd64, so this cross-compiles for arm64 and reads the disassembly. See the script's header.
      - name: FMA contraction (arm64)
        run: ./scripts/check-fma-contraction.py
      # staticcheck: static analysis beyond go vet (real bugs, dead code, simplifications).
      # Pinned; the tree already passes it clean. See docs/adr/0016-app-package-architecture.md.
      # Nothing bumps a pin in a run: line, Dependabot included, so it is bumped by hand: a release
      # a year and a half old analyses today's Go without knowing it (2025.1.1 until 2026.2.1).
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      # govulncheck: fails on a known vulnerability reachable from our code. A hard gate rather than
      # advisory because we own an XML signature verifier (SAML, ADR 0023): its signing dependencies
      # have shipped signature-bypass CVEs, and a routine `go mod tidy` must not be able to walk the
      # module graph back onto a vulnerable version without CI noticing. Pinned so a new advisory
      # database release is the only thing that can change this gate's verdict.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # -count=1 disables Go's test result cache: the build cache is restored between runs, and a
      # cached "ok" from a previous run would let a flaky test report green without executing.
      # internal/app is not here: go-test-shard runs it, in pieces.
      - name: Test
        run: |
          set -o pipefail
          go list ./... | grep -v '/internal/app$' | xargs go test -count=1 -timeout=20m 2>&1 | tee go-test-output.txt
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-output
          path: go-test-output.txt
          retention-days: 7
      # A SAVE KEEPS ONLY WHAT ITS RUN USED. Each save carries forward all that its restore
      # brought, and Go's own trim drops only what went unused for five days: that bounds an
      # object's age, not the cache's size. Nearly every main push rebuilds internal/app (its
      # non-race archive alone is 13.9 MB) and main has taken twenty-odd pushes in a day, so five
      # days of objects no run reads again would swell each key that every job downloads before
      # it starts, and crowd buildx's image layers out of the repository's 10 GB of cache.
      # Go refreshes an entry's mtime when it uses one over an hour old, and the restore keeps
      # the saved mtimes, so all a run used is under 90 minutes old at its save (no job here may
      # run past 30); an entry three hours old went unused. The match is Go's own trim's: only
      # the -a and -d entries of the 256 subdirectories, and a cached `go run` binary (staticcheck,
      # govulncheck) goes whole, since its directory carries the refreshed mtime and not the file.
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find ~/.cache/go-build ~/.cache/staticcheck -mindepth 2 -maxdepth 2 \
            \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # internal/app's ordinary run, dealt over four shards by recorded duration: the Go toolchain has
  # no -shard flag, so each shard lists the tests and scripts/ci_shard.py prints its share for -run.
  # Dealt by position, the shards ran 243s to 594s of tests; dealt by the durations in
  # .github/ci/internal-app-test-timings.txt (heaviest first, to the lightest shard), 409s to 426s.
  # A test the file does not know is dealt by position, so a new test lands in exactly one shard
  # without editing anything, and a stale file costs balance, never coverage. To refresh it, put
  # the go-test-shard-N-timings artifacts of a recent main run together:
  #   gh run download <run> -p 'go-test-shard-*-timings' && cat go-test-shard-*-timings/*.txt \
  #     | awk '{printf "%9s  %s\n", $1, $2}' | sort -k2 > .github/ci/internal-app-test-timings.txt
  # Every shard has its own PostgreSQL service because the PostgreSQL variants are most of the
  # package's time, and the tests of one shard must not share a database with another's. The shard
  # count comes from the matrix (strategy.job-total) so the partition cannot fall out of step with
  # it; a shard dealt nothing fails rather than pass green. release_guard_test.py holds the job
  # name, this matrix and release_guard.ci_ready to one count.
  go-test-shard:
    name: go test (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: reports_test
        ports:
          - 5432:5432
        # The data directory on tmpfs: a throwaway CI database needs no durability, and every
        # commit's fsync to the runner's disk is time the PostgreSQL variants spend waiting.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U portal -d reports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test-checks explains, restore half only and under its key: the
      # shards compile the same objects (its focused steps already build the internal/app test
      # package), and go-test-checks saves them. The path list must be the one the save uses:
      # actions/cache folds it into the cache version, and a different list never matches.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # -v so that every top-level test reports its own duration; the next step ranks them. The
      # list is built with the same flags as the run, so the run reuses its compile.
      - name: Test shard ${{ matrix.shard }}/${{ strategy.job-total }} of internal/app
        shell: bash
        run: |
          set -euo pipefail
          # Fuzz targets are listed too: an ordinary run executes their seed corpus as a test.
          tests=$(go test -list '^(Test|Fuzz)' ./internal/app/ | grep -E '^(Test|Fuzz)' | grep -v '^TestMain$')
          regex=$(printf '%s\n' "$tests" | python3 -B scripts/ci_shard.py --shard "${{ matrix.shard }}" --of "${{ strategy.job-total }}" --timings .github/ci/internal-app-test-timings.txt)
          test -n "$regex" || { echo "::error::shard ${{ matrix.shard }}/${{ strategy.job-total }} was given no tests"; exit 1; }
          go test -v -count=1 -timeout=20m -run "^(${regex})$" ./internal/app/ 2>&1 | tee "go-test-shard-${{ matrix.shard }}.txt"
      # The slowest top-level tests of this shard, so a test that is becoming the long pole shows
      # up in the run summary and in the uploaded artifact before it times a shard out.
      - name: Slowest tests
        if: always()
        shell: bash
        run: |
          f="go-test-shard-${{ matrix.shard }}.txt"
          test -f "$f" || exit 0
          awk '/^--- (PASS|FAIL|SKIP): /{d=$4; gsub(/[()s]/,"",d); printf "%9.2fs  %s\n", d, $3}' "$f" | sort -rn > "go-test-timings-${{ matrix.shard }}.txt"
          {
            echo "### Shard ${{ matrix.shard }}/${{ strategy.job-total }}: slowest tests"
            echo '```'
            head -25 "go-test-timings-${{ matrix.shard }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-shard-${{ matrix.shard }}-output
          path: go-test-shard-${{ matrix.shard }}.txt
          retention-days: 7
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-shard-${{ matrix.shard }}-timings
          path: go-test-timings-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  # The required check. A job that `needs` a failed shard is skipped unless it says always(), and
  # branch protection counts a skipped required check as passed, so this must run and fail itself.
  # A skipped Go job passes only on a pull request the changes job found to need no Go job; on a
  # push or a manual run the changes job always says go=true.
  go-test:
    name: go-test
    if: always()
    needs: [changes, go-test-checks, go-test-shard]
    runs-on: ubuntu-latest
    steps:
      - name: The checks and every test shard passed, or the pull request needs no Go job
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.go }}" = false ]; then
            test "${{ needs.go-test-checks.result }}" = skipped
            test "${{ needs.go-test-shard.result }}" = skipped
          else
            test "${{ needs.go-test-checks.result }}" = success
            test "${{ needs.go-test-shard.result }}" = success
          fi

  # Full -race over every package, on main pushes and manual runs only. A pull request has no race
  # lane (there used to be a required check "go race"): the race detector's cost on every PR was
  # out of proportion to what it caught there, and a race missed in review turns into a red main
  # here instead of a blocked PR. release_guard.ci_ready waits for these jobs, so no release is
  # tagged from a commit that was not raced in full.
  # The other packages get their own job rather than riding in every shard — they were ~50s of
  # duplicated work per shard. internal/app is one big test binary and dominates the wall clock,
  # so its tests are split four ways by a partition generated from the test list (the Go
  # toolchain has no -shard flag). Round-robin over the deterministic list keeps the shards
  # balanced as tests are added and is self-maintaining: a new test lands in exactly one shard
  # without editing this file. Four is the point of diminishing returns: every shard pays the same
  # ~45s race-instrumented compile, so eight shards saved only ~20s more wall clock at twice the
  # jobs. (Measured on main: 4x~3m, 8x~2m40s, unsplit 6m30s.) Those numbers predate the per-job
  # build cache (see go-test-checks), which takes most of that compile off every shard; the count has
  # not been retuned since.
  #
  # go-race-others also carries the app platform's focused tests under the race detector on
  # PostgreSQL, which were a PR job of their own (go race (app platform, PostgreSQL)). The
  # full internal/app shards below have no database, so their PostgreSQL variants skip; the steps
  # at the end of this job are the only race runs of those variants. The runner's broker,
  # transport and control egress tests need no database and are in the package run above them.
  go-race-others:
    name: go race full (other packages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # internal/apprunner/journal alone takes 5m37s under -race on two cores (43s without it) and
    # the job took 5.5-6m on runners, so the old 5m package timeout and 10m job cap sat at the
    # edge of the measured runtime. The limits keep about twice the measured time.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: reports_test
        ports:
          - 5432:5432
        # The data directory on tmpfs: a throwaway CI database needs no durability, and every
        # commit's fsync to the runner's disk is time the PostgreSQL variants spend waiting.
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U portal -d reports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Only the steps that name it use the database: the package run must stay as it was.
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test-checks explains, under a key of its own: no other job builds these
      # packages' race-instrumented tests.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-race-others-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Race the other packages
        run: |
          set -o pipefail
          go list ./... | grep -v '/internal/app$' | xargs go test -race -count=1 -timeout=12m 2>&1 | tee go-race-others.txt
      # The app platform's focused tests under the race detector, on PostgreSQL. internal/app is
      # outside the package run above, and go-race-full runs it without a database.
      - name: App platform on PostgreSQL (service egress)
        env:
          TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
        run: GOMAXPROCS=2 go test -race -p 2 -count=1 -timeout=8m ./internal/app -run '^TestPlatformServiceEgress'
      - name: App platform on PostgreSQL (credential schema and custody)
        env:
          TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
        run: GOMAXPROCS=2 go test -race -p 2 -count=1 -timeout=3m -v ./internal/app -run '^TestPlatform(Credential|SecretBindingPolicy|SecretUninstall)'
      - name: App platform on PostgreSQL (capability review and publication)
        env:
          TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
        run: GOMAXPROCS=2 go test -race -p 2 -count=1 -timeout=3m -v ./internal/app -run '^(TestPlatformInstallCapability|TestManagedInstallRequiresOpaqueRuntimeFacts)'
      - name: App platform on PostgreSQL (network provider and viewer request authority)
        env:
          TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
        run: |
          GOMAXPROCS=2 go test -race -p 2 -count=1 -timeout=2m -v ./internal/app -run '^TestPlatformNetworkRuntimeNoAuthority'
          GOMAXPROCS=2 go test -race -p 2 -count=1 -timeout=3m -v ./internal/app -run '^TestPlatformNetwork(Request|HTTP)'
      - name: Upload race output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-others-output
          path: go-race-others.txt
          retention-days: 7
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  go-race-full:
    name: go race full (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Each shard job took 9.5-11.5 minutes on runners (setup included), so the old 10m test
    # timeout fired on whichever shard ran slowest, with an unrelated test named as running.
    # Both limits keep about twice the measured time; every test stays in the race run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test-checks explains, one key for all four shards: they compile the same
      # objects, since the partition changes only which tests run, so shard 1 alone saves it.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-race-app-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The list is built with -race, the same flags as the run, so the run reuses its compile and
      # only relinks. Listed without -race it compiled internal/app a second time, uninstrumented,
      # for nothing but its test names. The shard count comes from the matrix (strategy.job-total),
      # so the partition cannot fall out of step with it, and a shard with no tests fails rather
      # than passing green with nothing raced. release_guard_test.py holds the job name, this
      # matrix and release_guard.ci_ready to one count.
      - name: Race shard ${{ matrix.shard }}/${{ strategy.job-total }} of internal/app
        shell: bash
        run: |
          set -euo pipefail
          tests=$(go test -race -list '^Test' ./internal/app/ | grep '^Test' | grep -v '^TestMain$')
          regex=$(printf '%s\n' "$tests" | awk -v s="${{ matrix.shard }}" -v m="${{ strategy.job-total }}" 'NR % m == s % m' | paste -sd'|' -)
          test -n "$regex" || { echo "::error::shard ${{ matrix.shard }}/${{ strategy.job-total }} was given no tests"; exit 1; }
          go test -race -count=1 -timeout=20m -run "^(${regex})$" ./internal/app/ 2>&1 | tee "go-race-shard-${{ matrix.shard }}.txt"
      - name: Upload race output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-shard-${{ matrix.shard }}-output
          path: go-race-shard-${{ matrix.shard }}.txt
          retention-days: 7
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        with:
          path: ~/.cache/go-build
          key: go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # The project's own tests passing does not prove the workflow YAML is valid. actionlint checks
  # expressions, matrix and job dependencies, and shell-checks the embedded run: scripts with the
  # shellcheck that ships on the runner image.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, for the secret scan below: it walks the commits a pull request adds.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncached, and that is the fix rather than an omission. This job finishes first, so with
          # setup-go's cache on it saved the key every Go job shared, and froze 24 MB of actionlint
          # objects as their build cache (see go-test-checks). Compiling actionlint cold costs it ~10s.
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # actionlint's shellcheck sees only the run: blocks, not the scripts they call. Those carry
      # the release (scripts/lib/*.sh is sourced by release.yml, check-release-build.sh passes or
      # fails every binary) and the image's entrypoint, which starts as root and drops privileges.
      # They are POSIX sh and run under dash here and in debian-slim, where a bashism that works in
      # a developer's shell fails, and the tests above exercise only the paths they call. -x with
      # SCRIPTDIR follows each `. lib/...` the way the script resolves it. About a second.
      # Secret scan of what this change adds, not of the history: a pull request's own commits
      # (HEAD^1 is the base branch in GitHub's merge commit), a push's new commits, or the tip commit
      # of a manual run. The release binary is pinned and checked against the checksum published with
      # v8.30.1, the way actionlint is pinned above; .gitleaks.toml keeps the default rules and allows
      # only test fixtures. A finding names the file and line; the secret itself is redacted.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/gitleaks"
          mkdir "$tool"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tool/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $tool/$archive" | sha256sum -c -
          tar -xzf "$tool/$archive" -C "$tool" gitleaks
          case "$EVENT_NAME" in
            pull_request) range='--no-merges HEAD^1..HEAD' ;;
            push) if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="--no-merges $PUSH_BEFORE..HEAD"; else range='-n 1'; fi ;;
            *) range='-n 1' ;;
          esac
          "$tool/gitleaks" git --no-banner --redact=100 --config .gitleaks.toml --log-opts "$range" .
      - name: Shell scripts
        run: git ls-files -z '*.sh' deploy/app-runner/portal-app-runner-entry | xargs -0 shellcheck -x -P SCRIPTDIR
      - name: Release script tests
        # The CalVer rules and the rolling-channel decision are pure shell, and they are tested as
        # shell: YAML parsing cannot check whether a year carries an ISO week 53, whether v2026.9.2
        # sorts before v2026.10.1, or whether an old-series patch loses the race for :latest.
        run: |
          sh scripts/calver_test.sh
          sh scripts/channel_targets_test.sh
          sh scripts/tag_release_test.sh
          sh scripts/release_derive_test.sh
          sh scripts/proxy_pin_probe_test.sh
          sh scripts/app_runner_entry_test.sh
      - name: E2E harness tests
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

  web-checks:
    name: web lint + typecheck + build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Publisher signature fixture reproducibility
        run: node scripts/generate_publisher_signature_vectors.mjs --check
      - name: Runner command fixture reproducibility
        run: node scripts/generate_runner_command_vectors.mjs --check
      - name: Install deps
        working-directory: web
        run: npm ci
      # THE RULES OF HOOKS ARE A GATE, AND LITTLE ELSE IS LINTED. A hook called after an early
      # return type-checks and passes every test that never reaches a second render, then blanks the
      # page with "rendered more hooks than during the previous render": StockPage.test.tsx guards
      # that one page against it (Grid.useBreakpoint), and no test guards the rest. oxlint does not
      # load the `typescript` package, so the native TypeScript 7 compiler is no obstacle, and it
      # reads all of src in under a second. exhaustive-deps only warns (web/.oxlintrc.json): a
      # missing dependency is sometimes the intent, and the source's eslint-disable directives for
      # it now suppress a rule that actually runs.
      - name: Lint (rules of hooks)
        working-directory: web
        run: npm run lint
      - name: Typecheck # tsc --noEmit: catches type errors the build would tolerate
        working-directory: web
        run: npm run typecheck
      - name: Build SPA # vite build → ../internal/web/dist; fails on any compile error
        working-directory: web
        run: npm run build

  # The vitest suite is the long pole of the web checks (over 1,500 tests, three and a half
  # minutes in one job), and each file is independent, so the files are dealt over three shards. The
  # split is by recorded duration, not vitest's equal-count hash slices: web/vite.config.ts installs
  # web/src/test/balancedSequencer.ts, which reads web/test-durations.json (refresh it with
  # `npm run test:durations` after adding or reworking a heavy suite). A file missing from the table
  # is weighed at the median, so a new test lands in exactly one shard and never breaks the split.
  # The job and its name stay as they are: the required checks are the matrix legs.
  web-test:
    name: web tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      - name: Unit tests ${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: web
        run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The required check keeps its name and now summarises the two jobs above. It says always() for
  # the same reason as "go-test": a skipped required check would count as passed. A skipped web job
  # passes only when the changes job found the pull request to need no web job.
  web-build:
    name: web typecheck + build
    if: always()
    needs: [changes, web-checks, web-test]
    runs-on: ubuntu-latest
    steps:
      - name: The web checks and every test shard passed, or the pull request needs no web job
        run: |
          test "${{ needs.changes.result }}" = success
          if [ "${{ needs.changes.outputs.web }}" = false ]; then
            test "${{ needs.web-checks.result }}" = skipped
            test "${{ needs.web-test.result }}" = skipped
          else
            test "${{ needs.web-checks.result }}" = success
            test "${{ needs.web-test.result }}" = success
          fi

  # Builds the final release image and runs it. This used to stop at `--target runtime-base` (the
  # font gate), so the first execution of the actual container — entrypoint, privilege drop,
  # config seeding, HTTP bind, /healthz — happened on a user's machine. The full build runs the
  # same font gate on the way through and then proves the container starts and answers.
  # Needed by any Go or web change, since the image carries both; a docs-only pull request skips it.
  # It is a required check, and a job skipped by its own `if:` reports as passed, which here is
  # meant: it is skipped only when the changes job succeeded and said so. Had the changes job
  # failed, this would skip too, but go-test and web typecheck + build then fail. A push
  # always runs it (release_guard.ci_ready waits for it).
  docker-image:
    name: docker image (font gate + smoke)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test-checks explains, under a key of its own: CGO_ENABLED=0 and -trimpath
      # give this binary's objects action IDs no other job produces.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-docker-image-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build SPA for the embedded binary
        working-directory: web
        run: |
          npm ci
          npm run build
      # The web half of go-test-checks' govulncheck gate. dompurify sanitises report HTML and mermaid
      # parses report diagrams, content the portal did not author (.github/dependabot.yml reviews
      # their bumps one at a time), and nothing kept a merge from landing while either carried a
      # published advisory: Dependabot reports one beside the merge, not in its way. Production
      # dependencies only, at high or critical, so the dev toolchain's advisories stay out. As with
      # govulncheck, a newly published advisory can turn an unrelated PR red, which is when it
      # should be seen. Here rather than in the web job, which is the PR critical path.
      # IT HOLDS RELEASES TOO, on purpose: release_guard.ci_ready requires this job. Unlike
      # govulncheck, npm audit cannot tell whether the advisory reaches our code, so the way out
      # is written here. When a fixed release exists but a parent's range keeps it out, pin it with
      # an `overrides` entry in web/package.json. When none exists yet, lower this step to
      # --audit-level=critical (for a critical, comment it out) with a dated comment naming the
      # advisory, and restore it when the fix ships. An unreachable registry fails it too: re-run.
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # THE RELEASE RECIPE, AND THE RELEASE'S OWN CHECK OF IT. The ldflags are release.yml's build
      # leg with Version=ci, and check-release-build.sh is the script that passes or fails each
      # release binary, which used to run for the first time during a release (v2026.38.2 and .6
      # both died in it on vcs.modified=true, from release-only steps). It reads the compiler,
      # platform, commit, CGO setting and clean worktree back out of the binary, here after the SPA
      # build has written into the checkout, so a build step that dirties a tracked file fails a PR
      # instead. On a pull request HEAD is the merge commit, and that is what Go stamps. The probe
      # below requires the injected commit, which catches an -X that silently stopped applying (a
      # renamed variable is not a link error). A second or so.
      - name: Build the linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mod=$(go list -m)
          sha=$(git rev-parse HEAD)
          mkdir -p bin/linux-amd64
          ldflags="-s -w -X ${mod}/internal/version.Version=ci"
          ldflags+=" -X ${mod}/internal/version.Commit=${sha:0:7}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=$(date -u +%FT%TZ)"
          go build -trimpath -ldflags "${ldflags}" -o bin/linux-amd64/report-portal ./cmd/report-portal
          sh scripts/check-release-build.sh bin/linux-amd64/report-portal linux amd64 "$sha"
          go build -trimpath -ldflags "${ldflags}" -o bin/linux-amd64/app-task-worker ./cmd/app-task-worker
          sh scripts/check-release-build.sh bin/linux-amd64/app-task-worker linux amd64 "$sha" app-task-worker
      - uses: docker/setup-buildx-action@v4
      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64 # one arch is enough to catch a Dockerfile or startup error
          push: false
          load: true
          tags: report-portal:ci
          cache-from: type=gha,scope=report-portal-image
          # PRs reuse main's cache without exporting a large disposable per-PR copy.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=report-portal-image,mode=max' || '' }}
      - name: Run the image and probe it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rp-e2e-data"
          docker run -d --name rp-smoke -p 127.0.0.1:18790:8790 \
            -v "$RUNNER_TEMP/rp-e2e-data:/app/data" report-portal:ci
          healthy=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18790/healthz; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::/healthz did not answer within 120s"
            docker logs rp-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:18790/healthz; echo
          # The entrypoint starts as root and must hand the server over to PUID/PGID (10001);
          # PID 1 is the server because the entrypoint execs it.
          server_uid=$(docker exec rp-smoke cat /proc/1/status | awk '/^Uid:/{print $2}')
          if [ "$server_uid" != "10001" ]; then
            echo "::error::server runs as uid ${server_uid}, want 10001"
            docker logs rp-smoke
            exit 1
          fi
          # The version subcommand proves the binary executes inside the image with no network,
          # no capabilities and as a non-root user, and that the injected build id survived.
          version_out=$(docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --user 10001:10001 \
            --entrypoint /app/report-portal report-portal:ci version)
          echo "$version_out"
          sha=$(git rev-parse HEAD)
          case "$version_out" in
            "ci (${sha:0:7}, "*) ;;
            *) echo "::error::version output is missing the injected build id or commit"; exit 1 ;;
          esac
          # The task worker ships in the same image (a granted network.proxy needs its egress coordinator).
          # Run without a config path it prints its usage and exits 2: proof it is present, executable and
          # runs as the unprivileged uid.
          rc=0
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --entrypoint /app/app-task-worker -e RP_CONFIG= report-portal:ci >/dev/null || rc=$?
          test "$rc" = 2 || { echo "::error::app-task-worker exited ${rc} without a config, want 2"; exit 1; }
          # The same through the image's own entrypoint, as the compose service starts it: no --entrypoint, no
          # --user. The entrypoint starts as root, drops to PUID/PGID with gosu and execs the worker named as the
          # command, which prints its usage and exits 2.
          rc=0
          docker run --rm --network none -e RP_CONFIG= report-portal:ci /app/app-task-worker >/dev/null || rc=$?
          test "$rc" = 2 || { echo "::error::app-task-worker through the entrypoint exited ${rc}, want 2"; exit 1; }
          # And running: PID 1 is the worker, as uid 10001, with no HTTP listener of its own.
          docker run -d --name rp-worker-smoke --network none report-portal:ci \
            /app/app-task-worker --config /app/config/config.yaml >/dev/null
          started=0
          for _ in $(seq 1 30); do
            if docker logs rp-worker-smoke 2>&1 | grep -q 'application task worker .* started'; then started=1; break; fi
            sleep 1
          done
          worker_uid=$(docker exec rp-worker-smoke awk '/^Uid:/{print $2}' /proc/1/status || true)
          # The redirect must run inside the container: a host-side </proc/... would read the runner's own file,
          # and docker exec without -i passes no stdin anyway.
          worker_cmd=$(docker exec rp-worker-smoke sh -c "tr '\0' ' ' </proc/1/cmdline" || true)
          docker logs rp-worker-smoke 2>&1 | tail -n 5
          docker rm -f rp-worker-smoke >/dev/null
          test "$started" = 1 || { echo "::error::app-task-worker did not start through the entrypoint"; exit 1; }
          test "$worker_uid" = 10001 || { echo "::error::app-task-worker runs as uid ${worker_uid}, want 10001"; exit 1; }
          case "$worker_cmd" in /app/app-task-worker\ *) ;; *) echo "::error::PID 1 is '${worker_cmd}', want the worker"; exit 1 ;; esac
      - name: End-to-end checks against the release image
        run: |
          set -euo pipefail
          admin_password=$(docker logs rp-smoke 2>&1 | sed -n 's/^    password: //p' | head -n 1)
          test -n "$admin_password" || { echo "::error::bootstrap password not found"; exit 1; }
          echo "::add-mask::$admin_password"
          # The image owns its database as UID 10001. Root on the disposable runner can
          # access the bind mount without changing the production image's permissions.
          sudo env E2E_BASE=http://127.0.0.1:18790 \
            E2E_DB="$RUNNER_TEMP/rp-e2e-data/portal.db" E2E_CONTAINER=rp-smoke \
            E2E_ADMIN_PASSWORD="$admin_password" \
            python3 scripts/e2e_check.py
      - name: Container diagnostics
        if: failure()
        run: docker logs rp-smoke
      - name: Remove test container
        if: always()
        run: docker rm -f rp-smoke || true
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # THE OTHER FIVE RELEASE TARGETS, COMPILED BEFORE A TAG RATHER THAN BY ONE. docker-image builds
  # linux/amd64; release.yml also ships linux/arm64, darwin and windows, and nothing compiled those
  # until a release did. The repository has no build tags, so the realistic break is a dependency:
  # modernc.org/sqlite and libc carry generated code per GOOS/GOARCH, and Dependabot bumps them
  # weekly. So this runs on a main push, where release_guard waits for it, and on Dependabot's Go
  # module PRs, where such a break is introduced; other PRs skip it. Each binary gets the release's
  # ldflags and check-release-build.sh, as in docker-image. Not a required check.
  #
  # THE CACHE KEY IS go.mod AND go.sum, NOT THE RUN ID. Nearly all the compile is the dependencies,
  # the five platforms' modernc code above all (~35s a target cold, ~280 MB of cache each), and they
  # change only with those two files, which also carry the toolchain version. This repository's own
  # packages recompile in ~3s a target on top of warm dependencies. A per-run key would upload
  # ~400 MB compressed on every main push to save those seconds; this one is written once per
  # dependency change, and a PR that bumps one restores main's entry by prefix.
  release-targets:
    name: release targets (cross-compile)
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'dependabot/go_modules/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-release-targets-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-build-release-targets-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify each target
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mod=$(go list -m)
          sha=$(git rev-parse HEAD)
          ldflags="-s -w -X ${mod}/internal/version.Version=ci"
          ldflags+=" -X ${mod}/internal/version.Commit=${sha:0:7}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=$(date -u +%FT%TZ)"
          for target in linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            case "$goos" in windows) ext=.exe ;; *) ext= ;; esac
            out="bin/${goos}-${goarch}/report-portal${ext}"
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "${ldflags}" -o "$out" ./cmd/report-portal
            sh scripts/check-release-build.sh "$out" "$goos" "$goarch" "$sha"
            if [ "$goos" = linux ]; then
              out="bin/${goos}-${goarch}/app-task-worker"
              GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "${ldflags}" -o "$out" ./cmd/app-task-worker
              sh scripts/check-release-build.sh "$out" "$goos" "$goarch" "$sha" app-task-worker
            fi
          done
      # release.yml's build-runner job ships app-runner for linux/amd64 and linux/arm64 only (doc 182 D8); the same
      # compile and provenance check run here so a break is found before a tag.
      - name: Build and verify app-runner
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for arch in amd64 arm64; do
            out="bin/runner-linux-${arch}/app-runner"
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/app-runner
            sh scripts/check-release-build.sh "$out" linux "$arch" "$sha" app-runner
          done
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/go-build
          key: go-build-release-targets-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
