name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs may be cancelled. Every main push and manual run gets its own
# group so neither running nor pending full-race backstops can be replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No go.work on the runner, and no silent toolchain download: the installed Go must satisfy the
# go directive exactly. (Adopted from Passwall-Sub-Panel's CI.)
env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: reports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d reports_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Enables the Postgres integration test (TestPostgresQueries); without this the
      # test skips. Verifies the real PG path: schema DDL, STRING_AGG, ILIKE search.
      TEST_POSTGRES_DSN: "postgres://portal:portal@localhost:5432/reports_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v6
      # EACH GO JOB KEEPS ITS OWN BUILD CACHE, AND setup-go KEEPS NONE. setup-go's `cache: true`
      # stores one entry per toolchain and go.sum for every job in this file, and a key cannot be
      # written twice, so whichever job finished first owned it for all of them. That was workflow
      # lint, whose only Go work is compiling actionlint: every job restored its 24 MB and compiled
      # the rest from source (`go build` 34s and staticcheck 30s here, ~100s of each race shard's
      # step, 26-38s of docker-image's binary) on every run since go.sum last changed in #41.
      # Modules are left to the proxy: downloading all of them takes ~3s.
      #
      # RESTORED ON EVERY EVENT, SAVED ONLY FROM A MAIN PUSH. A save from a pull request is visible
      # only to later runs of that same PR, while a save from main is one every PR can read, so
      # main is the only place a save earns its upload. The save is the job's last step and
      # carries the implicit success(), so a run that failed writes nothing.
      #
      # THE KEY ENDS IN THE RUN ID, NOT AT go.sum. A key cannot be overwritten, so a go.sum key
      # would freeze at the first main push after a dependency change: at that commit's packages,
      # and at its toolchain, so a Go patch bump in go.mod would turn every entry into a miss that
      # nothing could replace until go.sum next moved. A key per run lets every main push leave
      # the newest cache for the next run to restore by prefix. Superseded keys are never read
      # again and age out of the repository's cache storage; what the newest key carries is
      # bounded by the trim before each save (below). A prefix restore is safe because the cache
      # is content-addressed: a stale entry is a miss, never a wrong build. staticcheck's
      # analysis cache rides along in this job's key.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-test-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # gofmt was a step in the release checklist, run by hand ("vet and gofmt"), and nothing here
      # enforced it. Passwall-Sub-Panel gates on it after an unformatted file passed its CI and
      # failed a sibling's instead; the same hands edit this tree. Under a second.
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { printf '::error::gofmt -w would change:\n%s\n' "$unformatted"; exit 1; }
      - run: go build ./... # compile every package (fails fast on a build break)
      - run: go vet ./...
      # staticcheck: static analysis beyond go vet (real bugs, dead code, simplifications).
      # Pinned; the tree already passes it clean. See docs/adr/0016-app-package-architecture.md.
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # govulncheck: fails on a known vulnerability reachable from our code. A hard gate rather than
      # advisory because we own an XML signature verifier (SAML, ADR 0023): its signing dependencies
      # have shipped signature-bypass CVEs, and a routine `go mod tidy` must not be able to walk the
      # module graph back onto a vulnerable version without CI noticing. Pinned so a new advisory
      # database release is the only thing that can change this gate's verdict.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # -count=1 disables Go's test result cache: the build cache is restored between runs, and a
      # cached "ok" from a previous run would let a flaky test report green without executing.
      - name: Test
        run: |
          set -o pipefail
          go test -count=1 -timeout=5m ./... 2>&1 | tee go-test-output.txt
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-test-output
          path: go-test-output.txt
          retention-days: 7
      # A SAVE KEEPS ONLY WHAT ITS RUN USED. Each save carries forward all that its restore
      # brought, and Go's own trim drops only what went unused for five days: that bounds an
      # object's age, not the cache's size. Nearly every main push rebuilds internal/app (its
      # non-race archive alone is 13.9 MB) and main has taken twenty-odd pushes in a day, so five
      # days of objects no run reads again would swell each key that every job downloads before
      # it starts, and crowd buildx's image layers out of the repository's 10 GB of cache.
      # Go refreshes an entry's mtime when it uses one over an hour old, and the restore keeps
      # the saved mtimes, so all a run used is under 90 minutes old at its save (no job here may
      # run past 30); an entry three hours old went unused. The match is Go's own trim's: only
      # the -a and -d entries of the 256 subdirectories, and a cached `go run` binary (staticcheck,
      # govulncheck) goes whole, since its directory carries the refreshed mtime and not the file.
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find ~/.cache/go-build ~/.cache/staticcheck -mindepth 2 -maxdepth 2 \
            \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # The race detector on the concurrent core, split by event: full `-race ./...` is dominated by
  # internal/app (one big test binary), which used to put 6+ minutes on every PR. A PR runs the
  # packages where concurrency actually lives plus the app package's scheduler/engine/webhook
  # tests; a main-branch push runs everything as the post-merge backstop, so a missed race turns
  # into a red main instead of a blocked PR.
  go-race:
    name: go race
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test explains, restore half only: this job never runs on main, so
      # a key of its own could never be saved. It reads the full shards' key, whose race objects
      # for internal/app and its dependencies are most of what it compiles.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-race-app-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Race the concurrency packages and the app scheduler tests
        run: |
          set -o pipefail
          {
            go test -race -count=1 -timeout=5m ./internal/queue/ ./internal/batch/ ./internal/dify/ ./internal/webhook/
            # The subset is name-based on purpose: the run queue, scheduler, retry/reconcile loops,
            # webhook delivery and chat gate are the paths a race detector can actually catch here.
            go test -race -count=1 -timeout=10m ./internal/app/ \
              -run 'Batch|Schedul|Priority|Ticket|Urgent|Queue|Cancel|Retry|Requeue|Resume|Reconcile|Webhook|Chat|Job|Throttle|Shutdown|Cleanup|Recurring|Dify'
          } 2>&1 | tee go-race-output.txt
      - name: Upload race output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-output
          path: go-race-output.txt
          retention-days: 7

  # Full -race over every package, on main pushes only: PRs run the scoped go-race lane above.
  # The other packages get their own job rather than riding in every shard — they were ~50s of
  # duplicated work per shard. internal/app is one big test binary and dominates the wall clock,
  # so its tests are split four ways by a partition generated from the test list (the Go
  # toolchain has no -shard flag). Round-robin over the deterministic list keeps the shards
  # balanced as tests are added and is self-maintaining: a new test lands in exactly one shard
  # without editing this file. Four is the point of diminishing returns: every shard pays the same
  # ~45s race-instrumented compile, so eight shards saved only ~20s more wall clock at twice the
  # jobs. (Measured on main: 4x~3m, 8x~2m40s, unsplit 6m30s.) Those numbers predate the per-job
  # build cache (see go-test), which takes most of that compile off every shard; the count has
  # not been retuned since.
  go-race-others:
    name: go race full (other packages)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test explains, under a key of its own: no other job builds these
      # packages' race-instrumented tests.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-race-others-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Race the other packages
        run: |
          set -o pipefail
          go list ./... | grep -v '/internal/app$' | xargs go test -race -count=1 -timeout=5m 2>&1 | tee go-race-others.txt
      - name: Upload race output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-others-output
          path: go-race-others.txt
          retention-days: 7
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-race-others-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  go-race-full:
    name: go race full (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test explains, one key for all four shards: they compile the same
      # objects, since the partition changes only which tests run, so shard 1 alone saves it. The
      # PR-only go race job restores this key too.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-race-app-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The list is built with -race, the same flags as the run, so the run reuses its compile and
      # only relinks. Listed without -race it compiled internal/app a second time, uninstrumented,
      # for nothing but its test names. The shard count comes from the matrix (strategy.job-total),
      # so the partition cannot fall out of step with it, and a shard with no tests fails rather
      # than passing green with nothing raced. release_guard_test.py holds the job name, this
      # matrix and release_guard.ci_ready to one count.
      - name: Race shard ${{ matrix.shard }}/${{ strategy.job-total }} of internal/app
        shell: bash
        run: |
          set -euo pipefail
          tests=$(go test -race -list '^Test' ./internal/app/ | grep '^Test' | grep -v '^TestMain$')
          regex=$(printf '%s\n' "$tests" | awk -v s="${{ matrix.shard }}" -v m="${{ strategy.job-total }}" 'NR % m == s % m' | paste -sd'|' -)
          test -n "$regex" || { echo "::error::shard ${{ matrix.shard }}/${{ strategy.job-total }} was given no tests"; exit 1; }
          go test -race -count=1 -timeout=10m -run "^(${regex})$" ./internal/app/ 2>&1 | tee "go-race-shard-${{ matrix.shard }}.txt"
      - name: Upload race output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-shard-${{ matrix.shard }}-output
          path: go-race-shard-${{ matrix.shard }}.txt
          retention-days: 7
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        with:
          path: ~/.cache/go-build
          key: go-build-race-app-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  # The project's own tests passing does not prove the workflow YAML is valid. actionlint checks
  # expressions, matrix and job dependencies, and shell-checks the embedded run: scripts with the
  # shellcheck that ships on the runner image.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncached, and that is the fix rather than an omission. This job finishes first, so with
          # setup-go's cache on it saved the key every Go job shared, and froze 24 MB of actionlint
          # objects as their build cache (see go-test). Compiling actionlint cold costs it ~10s.
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # actionlint's shellcheck sees only the run: blocks, not the scripts they call. Those carry
      # the release (scripts/lib/*.sh is sourced by release.yml, check-release-build.sh passes or
      # fails every binary) and the image's entrypoint, which starts as root and drops privileges.
      # They are POSIX sh and run under dash here and in debian-slim, where a bashism that works in
      # a developer's shell fails, and the tests above exercise only the paths they call. -x with
      # SCRIPTDIR follows each `. lib/...` the way the script resolves it. About a second.
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x -P SCRIPTDIR
      - name: Release script tests
        # The CalVer rules and the rolling-channel decision are pure shell, and they are tested as
        # shell: YAML parsing cannot check whether a year carries an ISO week 53, whether v2026.9.2
        # sorts before v2026.10.1, or whether an old-series patch loses the race for :latest.
        run: |
          sh scripts/calver_test.sh
          sh scripts/channel_targets_test.sh
          sh scripts/tag_release_test.sh
          sh scripts/release_derive_test.sh
      - name: E2E harness tests
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'

  web-build:
    name: web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        working-directory: web
        run: npm ci
      # THE RULES OF HOOKS ARE A GATE, AND LITTLE ELSE IS LINTED. A hook called after an early
      # return type-checks and passes every test that never reaches a second render, then blanks the
      # page with "rendered more hooks than during the previous render": StockPage.test.tsx guards
      # that one page against it (Grid.useBreakpoint), and no test guards the rest. oxlint does not
      # load the `typescript` package, so the native TypeScript 7 compiler is no obstacle, and it
      # reads all of src in under a second. exhaustive-deps only warns (web/.oxlintrc.json): a
      # missing dependency is sometimes the intent, and the source's eslint-disable directives for
      # it now suppress a rule that actually runs.
      - name: Lint (rules of hooks)
        working-directory: web
        run: npm run lint
      - name: Typecheck # tsc --noEmit: catches type errors the build would tolerate
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Build SPA # vite build → ../internal/web/dist; fails on any compile error
        working-directory: web
        run: npm run build

  # Builds the final release image and runs it. This used to stop at `--target runtime-base` (the
  # font gate), so the first execution of the actual container — entrypoint, privilege drop,
  # config seeding, HTTP bind, /healthz — happened on a user's machine. The full build runs the
  # same font gate on the way through and then proves the container starts and answers.
  docker-image:
    name: docker image (font gate + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # The build cache pair go-test explains, under a key of its own: CGO_ENABLED=0 and -trimpath
      # give this binary's objects action IDs no other job produces.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-docker-image-${{ runner.os }}-
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build SPA for the embedded binary
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the linux/amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mod=$(go list -m)
          mkdir -p bin/linux-amd64
          go build -trimpath -ldflags "-s -w -X ${mod}/internal/version.Version=ci" \
            -o bin/linux-amd64/report-portal ./cmd/report-portal
      - uses: docker/setup-buildx-action@v4
      - name: Build the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64 # one arch is enough to catch a Dockerfile or startup error
          push: false
          load: true
          tags: report-portal:ci
          cache-from: type=gha,scope=report-portal-image
          # PRs reuse main's cache without exporting a large disposable per-PR copy.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=report-portal-image,mode=max' || '' }}
      - name: Run the image and probe it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rp-e2e-data"
          docker run -d --name rp-smoke -p 127.0.0.1:18790:8790 \
            -v "$RUNNER_TEMP/rp-e2e-data:/app/data" report-portal:ci
          healthy=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:18790/healthz; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::/healthz did not answer within 120s"
            docker logs rp-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:18790/healthz; echo
          # The entrypoint starts as root and must hand the server over to PUID/PGID (10001);
          # PID 1 is the server because the entrypoint execs it.
          server_uid=$(docker exec rp-smoke cat /proc/1/status | awk '/^Uid:/{print $2}')
          if [ "$server_uid" != "10001" ]; then
            echo "::error::server runs as uid ${server_uid}, want 10001"
            docker logs rp-smoke
            exit 1
          fi
          # The version subcommand proves the binary executes inside the image with no network,
          # no capabilities and as a non-root user, and that the injected build id survived.
          version_out=$(docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --user 10001:10001 \
            --entrypoint /app/report-portal report-portal:ci version)
          echo "$version_out"
          case "$version_out" in
            *ci*) ;;
            *) echo "::error::version output is missing the injected build id"; exit 1 ;;
          esac
      - name: End-to-end checks against the release image
        run: |
          set -euo pipefail
          admin_password=$(docker logs rp-smoke 2>&1 | sed -n 's/^    password: //p' | head -n 1)
          test -n "$admin_password" || { echo "::error::bootstrap password not found"; exit 1; }
          echo "::add-mask::$admin_password"
          # The image owns its database as UID 10001. Root on the disposable runner can
          # access the bind mount without changing the production image's permissions.
          sudo env E2E_BASE=http://127.0.0.1:18790 \
            E2E_DB="$RUNNER_TEMP/rp-e2e-data/portal.db" E2E_CONTAINER=rp-smoke \
            E2E_ADMIN_PASSWORD="$admin_password" \
            python3 scripts/e2e_check.py
      - name: Container diagnostics
        if: failure()
        run: docker logs rp-smoke
      - name: Remove test container
        if: always()
        run: docker rm -f rp-smoke || true
      - name: Trim the build cache to what this run used
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: find ~/.cache/go-build -mindepth 2 -maxdepth 2 \( -name '*-a' -o -name '*-d' \) -mmin +180 -exec rm -rf {} +
      - uses: actions/cache/save@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-docker-image-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
