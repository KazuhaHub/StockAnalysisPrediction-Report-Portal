name: ops deployment drills
# OPS-05 (deploy a released platform through the beta configuration) and OPS-06 (restore the protected
# recovery set after a failed rollout), run on a disposable GitHub-hosted runner. No real server is
# touched, nothing is pushed to ghcr.io and the job holds no secret: the registry written to is a
# loopback one this job starts, and every credential is generated for the drill.
# See scripts/acceptance/ops_deploy_drills.py and docs/app-platform/167-owner-decisions-remaining-acceptance.md section 6.
on:
  push:
    branches: [test/app-platform-ops-drills]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Diagnostic only. Pin the released image to this tag instead of the newest published release. A run that pins a tag is never evidence
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ops-deployment-drills-${{ github.ref }}
  cancel-in-progress: false
jobs:
  drills:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPS_DRILL_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check the drill logic
        run: python3 -B -m unittest discover -s scripts -p ops_deploy_drills_test.py
      - name: Run the drills
        id: drills
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ops-drill/work" "$RUNNER_TEMP/ops-drill/evidence"
          python3 -B scripts/acceptance/ops_deploy_drills.py \
            --repo "$GITHUB_WORKSPACE" \
            --work "$RUNNER_TEMP/ops-drill/work" \
            --out "$RUNNER_TEMP/ops-drill/evidence"
      - name: Summarise the evidence
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/ops-drill/evidence/*.json; do
            [ -e "$f" ] || continue
            echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print(f"result: {doc.get('result')}  blockers: {doc.get('run', {}).get('evidence_blockers')}")
          for c in doc.get("checks", []):
              print(f"- {'pass' if c['passed'] else 'FAIL'} {c['id']}")
          PY
          done
      - name: Preserve the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ops-deployment-drills-evidence
          path: ${{ runner.temp }}/ops-drill/evidence
          if-no-files-found: warn
          retention-days: 90
      - name: Remove the drill stack and the loopback registry
        if: always()
        run: |
          docker compose -p opsdrill -f "$RUNNER_TEMP/ops-drill/work/beta/docker-compose.yml" down -v --remove-orphans || true
          docker ps -aq --filter label=org.portal.fixture=ops-drill | xargs -r docker rm -f
          docker rm -f ops-rehearsal || true
          sudo rm -rf "$RUNNER_TEMP/ops-drill/work"
