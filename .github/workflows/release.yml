name: Release

# One pipeline produces the release archives, the fixed ghcr.io image tag, and a published GitHub
# Release from one batch of binaries:
#
#   setup   → resolve the tag, refuse anything that is not a CalVer tag, resolve the commit
#   tag     → after the exact commit passes full CI, create or verify the annotated release tag
#   web     → build the SPA (Vite) once and reuse it as an artifact (rebuilding it inside every
#             matrix leg would be wasted work)
#   build   → matrix cross-compiles 6 platforms, downloads the web bundle into web/internal/dist and
#             //go:embed-s it into the binary
#   build-runner → cross-compiles app-runner for linux/amd64 and linux/arm64 only (doc 182 decision D8)
#   smoke-arm64 → start the linux/arm64 binary on an arm64 runner before the tag, draft or image
#   release → tar/zip + SHA256SUMS, then create or update the DRAFT GitHub Release
#   docker  → reuse the linux amd64/arm64 binaries to push the FIXED multi-arch image tag
#   docker-runner → the same for the app-runner image (doc 187), then run it by digest before anything is
#             recorded; smoke-runner-image-arm64 runs the arm64 image natively
#   record-metadata → attach the durable identity (commit + each image's digest) to the draft
#   publish → publish that draft as Beta or Stable, or leave it unpublished for review
#
# **A tag publishes a Beta.** The Actions form can cut the next tag from the latest fully-tested main
# commit and publish it as Beta or Stable, so the normal release path needs no local command.
#
# Maturity is still GitHub Release metadata, never the tag and never the binary: tag spelling selects
# nothing, and :latest / :beta are owned by release-channels.yml, which promotes the already-published
# bytes by digest and never rebuilds. See docs/adr/0034.
#
# A binary verified from the Release is byte-for-byte the one in the image (the same artifact).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version, e.g. v2026.38.12. Leave blank to choose the next CalVer tag."
        required: false
        type: string
      notes:
        description: "Reader-facing Markdown release notes stored on the annotated tag."
        required: true
        type: string
      maturity:
        description: "Release channel"
        required: false
        type: choice
        default: "beta"
        options: ["beta", "stable", "draft"]

# Least privilege by default. GITHUB_TOKEN writes to the repository in one place, tag's `git push`,
# and only tag asks it for contents: write. Every other repository mutation (the draft, its assets,
# publication) goes through RELEASE_PAT, because GITHUB_TOKEN is refused release creation here (see
# the release job), so release and docker read contents, docker's one write scope is packages for
# the image push, and publish asks for nothing. The scope matters where it would sit unused:
# actions/checkout leaves the token in .git/config, beside third-party actions. Everything else
# inherits contents: read, so a compromised build step cannot push to the repository.
permissions:
  contents: read

# EVERY ACTION NOT PUBLISHED BY GITHUB IS PINNED TO A COMMIT, not to a tag. The release and docker
# jobs hold RELEASE_PAT, the credential that also edits and publishes releases and writes the
# CHANNEL_* variables deciding what :latest points at, and packages: write on ghcr.io. A tag can be
# moved by whoever controls the action's repository, and a step can read every secret its job
# references out of the runner's memory, not only the ones handed to it: the
# tj-actions/changed-files compromise (March 2025) did exactly that and printed them into the build
# log. Dependabot's github-actions updates bump the commit and the version comment beside it
# together. release-channels.yml follows the same rule.

# Publisher jobs run with no go.work and no silent toolchain switch, mirroring test.yml.
env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

# Serialize attempts for the same tag without discarding other pending versions.
# Rolling channel writers have their own repository-wide serialization.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve and validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      sha: ${{ steps.t.outputs.sha }}
      create_tag: ${{ steps.t.outputs.create_tag }}
      owner_lc: ${{ steps.t.outputs.owner_lc }}
      repo_lc: ${{ steps.t.outputs.repo_lc }}
      short_sha: ${{ steps.t.outputs.short_sha }}
      build_date: ${{ steps.t.outputs.build_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The validator is a repository file, so the tag is judged by exactly the rules
          # scripts/tag-release.sh applies — one implementation, not two that can drift.
          fetch-depth: 0
          fetch-tags: true
      - id: t
        shell: bash
        # Passed through env rather than interpolated into the script: a workflow_dispatch input is
        # user-controlled text, and "${{ inputs.tag }}" inside a run: block is how a shell injection
        # enters a release pipeline.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          . scripts/lib/calver.sh
          . scripts/lib/release.sh

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
              echo "::error::run the release form from the ${DEFAULT_BRANCH} branch"
              exit 1
            fi
            if [ -z "$tag" ]; then
              tag=$(derive_version "$PWD" "$(calver_current_week)")
            fi
            if ! printf '%s' "$INPUT_NOTES" | grep -q '[^[:space:]]'; then
              echo "::error::release notes cannot be empty"
              exit 1
            fi
            if ! printf '%s' "$INPUT_NOTES" | python3 scripts/release_notes.py; then
              echo "::error::release notes must follow the bilingual format in docs/releases/README.md"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists; choose another version"
              exit 1
            fi
            sha=$(git rev-parse --verify HEAD)
            create_tag=true
          else
            tag="$GITHUB_REF_NAME"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}" || {
                echo "::error::no tag ${tag} on origin"; exit 1; }
            fi
            # Annotated tags only: the annotation carries the release note, and a lightweight tag
            # carries no identity of its own to check the build against.
            obj=$(git rev-parse --verify "refs/tags/${tag}")
            if [ "$(git cat-file -t "$obj")" != "tag" ]; then
              echo "::error::${tag} is a lightweight tag; release tags must be annotated"
              exit 1
            fi
            sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
            create_tag=false
          fi

          echo "::group::Validate the tag"
          if ! calver_valid "$tag"; then
            echo "::error::$tag is not a CalVer release tag. Expected vYYYY.W[.R] — the ISO"
            echo "::error::week-numbering year, the UTC ISO week the series starts in, and an optional"
            echo "::error::revision. No leading zeroes, no maturity suffix, no extra components."
            exit 1
          fi
          echo "$tag is a well-formed CalVer tag"
          echo "::endgroup::"

          owner_lc="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          # One build date for the whole artifact set. The Go binaries and the SPA bundle both carry
          # it, and the two must agree: the in-app update prompt compares build identity to decide
          # whether the page it is on is the build the server is serving. Reading the clock in each
          # of six platform legs would give the SPA and the binary it ships in different timestamps.
          #
          # The short sha is resolved here for the same reason: the binary stamps 7 characters and
          # the bundle must stamp exactly the same ones, or a page would never recognise itself in
          # the server's answer and would offer an update it is already running.
          build_date="$(date -u +%FT%TZ)"
          short_sha="${sha:0:7}"
          {
            echo "tag=${tag}"
            echo "sha=${sha}"
            echo "create_tag=${create_tag}"
            echo "owner_lc=${owner_lc}"
            echo "repo_lc=${repo_lc}"
            echo "short_sha=${short_sha}"
            echo "build_date=${build_date}"
          } >> "$GITHUB_OUTPUT"

      - name: Require the annotated release note
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          # The annotated tag carries the note, so a release can be cut from the already-green merge
          # commit without adding a release-only commit or weakening main's pull-request rule.
          git for-each-ref --format='%(contents)' "refs/tags/${VERSION}" > /tmp/reader-notes.md
          if ! grep -q '[^[:space:]]' /tmp/reader-notes.md; then
            echo "::error::annotated tag ${VERSION} has an empty release note"
            echo "::error::cut it with scripts/tag-release.sh --notes-file <path>"
            exit 1
          fi
          if ! python3 scripts/release_notes.py < /tmp/reader-notes.md; then
            echo "::error::release notes must follow the bilingual format in docs/releases/README.md"
            exit 1
          fi
          echo "release note: annotated tag ${VERSION}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse rebuilding an existing fixed image
        env:
          IMAGE: ghcr.io/${{ steps.t.outputs.owner_lc }}/${{ steps.t.outputs.repo_lc }}:${{ steps.t.outputs.tag }}
        run: python3 scripts/release_guard.py guard "$IMAGE"

  ci:
    name: Verify release commit passed full CI
    # It looks once and refuses while CI is still running, so a release holds no runner waiting for it;
    # web and build-runner (and build, through web) need it, so nothing is built for a commit CI has not
    # passed. Dispatch the release once the commit's full test.yml and licence.yml runs are green.
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # The default branch, not the release ref: this job runs the guard, and a guard supplied by the
      # thing it is guarding is not a guard. It also keeps the one job that has no reason to see the
      # release commit from checking it out.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require full CI for the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ needs.setup.outputs.sha }}
        run: python3 scripts/release_guard.py check-ci "$COMMIT"

  tag:
    name: Create or verify the annotated tag
    # Keep tag creation late: a failed platform build must not leave behind a version with no
    # publishable artifact set. The build itself needs only setup's resolved version and commit.
    # An arm64 binary that builds but cannot start is such a failure, so the smoke gates this too.
    needs: [setup, ci, build, build-runner, smoke-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Create or verify tag
        shell: bash
        env:
          CREATE_TAG: ${{ needs.setup.outputs.create_tag }}
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
          RELEASE_NOTES: ${{ inputs.notes }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          if [ "$CREATE_TAG" != "true" ]; then
            actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
            test "$actual" = "$EXPECTED_SHA" || {
              echo "::error::tag ${VERSION} no longer points at ${EXPECTED_SHA}"; exit 1; }
            echo "verified existing annotated tag ${VERSION}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION} was created while this run was building"
            exit 1
          fi
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT INT TERM
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git tag -a --cleanup=verbatim "$VERSION" "$EXPECTED_SHA" -F "$notes_file"
          # GITHUB_TOKEN deliberately suppresses a second tag-push workflow run. This run already
          # owns the build and continues after creating the immutable release identity.
          git push origin "refs/tags/${VERSION}"
          echo "created ${VERSION} at ${EXPECTED_SHA}"

  web:
    name: Build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, ci]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          # No shared cache here, for the same reason setup-go below is uncached: this workflow takes
          # a ref from a dispatch input, and a shared cache that a release job both reads and writes
          # is a cache an untrusted ref could seed. A release runs a few times a month, so paying for
          # a cold `npm ci` is cheaper than that surface. (CodeQL flags it as
          # actions/cache-poisoning/poisonable-step.)
          cache: ""
      - name: Install deps
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build SPA bundle
        working-directory: web
        # The bundle carries its own build identity, so a tab can say which build it is RUNNING
        # rather than assuming the first /api/version answer describes the page it loaded. It is the
        # same tag, commit and date the binaries are stamped with, which is what makes "the page is
        # not the build the server is serving" a comparison rather than a guess.
        env:
          VITE_BUILD_VERSION: ${{ needs.setup.outputs.tag }}
          VITE_BUILD_COMMIT: ${{ needs.setup.outputs.short_sha }}
          VITE_BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: npm run build # vite outputs to ../internal/web/dist for go:embed
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Deliberately uncached: a published binary must not come out of a shared, mutable build
          # cache. Recompiling from the checksum-verified module set costs a minute per leg and
          # buys determinism for the artifact users verify. (Pattern from Passwall-Sub-Panel.)
          cache: false
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist
      - name: Build report-portal
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          # The annotated note seeds the GitHub Release body. The running portal reads that Release
          # back from GitHub, which remains the sole authority if its body or maturity changes later.
          mkdir -p out
          mod=$(go list -m)
          short_sha="${SHORT_SHA}"
          build_date="${BUILD_DATE}"
          ldflags="-s -w"
          ldflags+=" -X ${mod}/internal/version.Version=${VERSION}"
          ldflags+=" -X ${mod}/internal/version.Commit=${short_sha}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=${build_date}"
          go build -trimpath -ldflags="${ldflags}" -o "out/report-portal${{ matrix.ext }}" ./cmd/report-portal
          # Prove the binary carries the provenance we think it does. go version -m reads it from
          # the binary itself, so a wrong module path (which makes every -X a silent no-op) or a
          # checkout of the wrong commit cannot pass.
          sh scripts/check-release-build.sh "out/report-portal${{ matrix.ext }}" "$GOOS" "$GOARCH" "$COMMIT"
      - uses: actions/upload-artifact@v7
        with:
          name: report-portal-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/report-portal${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  # THE APP RUNNER IS A SEPARATE, LINUX-ONLY BUILD. The runner drives rootful Docker and an XFS project-quota
  # root, so it exists only for linux/amd64 and linux/arm64 (docs/app-platform/182-cross-platform-backend-runtime.md,
  # D8). It is deliberately not a leg of the six-platform build above: that matrix and the six report-portal
  # artifacts stay exactly as they were. The matrix is spelled by architecture alone so the platform list the CI
  # tests read from `build` is not changed. The archives join the same SHA256SUMS.txt and the same provenance
  # check (module path, platform, commit, clean worktree, CGO off).
  build-runner:
    name: Build app-runner linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64 }
          - { goarch: arm64 }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Uncached for the same reason as the portal build: a published binary does not come out of a shared cache.
          cache: false
      - name: Build app-runner
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p out
          # `app-runner version` and the ready line print this identity (doc 187 section 12); the image smoke and
          # the operator's post-deploy check compare it with the release tag.
          mod=$(go list -m)
          ldflags="-s -w"
          ldflags+=" -X ${mod}/internal/version.Version=${VERSION}"
          ldflags+=" -X ${mod}/internal/version.Commit=${SHORT_SHA}"
          ldflags+=" -X ${mod}/internal/version.BuildDate=${BUILD_DATE}"
          go build -trimpath -ldflags="${ldflags}" -o out/app-runner ./cmd/app-runner
          sh scripts/check-release-build.sh out/app-runner "$GOOS" "$GOARCH" "$COMMIT" app-runner
      - name: Check the stamped identity (amd64 runs here; arm64 runs in smoke-arm64)
        if: matrix.goarch == 'amd64'
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          got=$(out/app-runner version)
          want="${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"
          echo "$got"
          test "$got" = "$want" || { echo "::error::app-runner version printed '${got}', want '${want}'"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: app-runner-linux-${{ matrix.goarch }}
          path: out/app-runner
          if-no-files-found: error
          retention-days: 1

  # THE ARM64 BINARY RUNS BEFORE A TAG IS CREATED. test.yml executes only linux/amd64 (the image
  # smoke) and compiles the other five targets without running them, and the docker job below only
  # copies the arm64 binary into the image. So an arm64 binary that cannot start, from a fault in
  # the runtime or in modernc's per-GOARCH sqlite code, say, would first run on a user's machine.
  # This starts the release's own artifact natively on an arm64 runner, free for a public repository
  # (a private one would need a larger runner or QEMU): `version` must print exactly the identity
  # setup stamped, and a first start in an empty directory must answer /healthz, which queries the
  # database. The tag job waits for it, and the draft and the image wait for the tag: setup refuses
  # a version whose tag exists, so a tag on a binary that cannot start spends that version, and a
  # fixed image tag is never replaced. That puts about 20-30s on the critical path once per
  # release, after the builds, which themselves start only once `ci` has passed. docker names it as
  # well, so its own reason does not rest on the tag job's needs.
  smoke-arm64:
    name: Start the linux/arm64 binary
    needs: [setup, build, build-runner]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-arm64, path: bin }
      # The runner cannot serve without root, Docker and an XFS root, so the smoke only proves the arm64 build
      # loads and runs its command surface natively; the provisioning command's help is the cheapest such call.
      - uses: actions/download-artifact@v8
        with: { name: app-runner-linux-arm64, path: runner-bin }
      - name: Run the arm64 app-runner command surface
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          runner="$PWD/runner-bin/app-runner"
          chmod +x "$runner"
          "$runner" provision-xfs-images --help | grep -q -- '--mount-checkpoint'
          "$runner" host-setup --help | grep -q -- '--apply'
          if "$runner" >/dev/null; then echo "::error::app-runner without a command must exit non-zero"; exit 1; fi
          got=$("$runner" version)
          want="${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"
          echo "$got"
          test "$got" = "$want" || { echo "::error::app-runner version printed '${got}', want '${want}'"; exit 1; }
      - name: Run version and probe /healthz
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64 || { echo "::error::runner is $(uname -m), not aarch64"; exit 1; }
          bin="$PWD/bin/report-portal"
          chmod +x "$bin"
          got=$("$bin" version)
          want="${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"
          echo "$got"
          if [ "$got" != "$want" ]; then
            echo "::error::version printed '${got}', want '${want}'"
            exit 1
          fi
          # No config and no database: the binary writes both, as on a first install.
          work=$(mktemp -d)
          cd "$work"
          RP_CONFIG="$work/config.yaml" RP_LISTEN=127.0.0.1:18790 "$bin" > server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            if health=$(curl -fs http://127.0.0.1:18790/healthz); then
              echo "$health"
              kill "$pid"
              wait "$pid" || true
              exit 0
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          echo "::error::the server exited, or /healthz did not answer within 30s"
          # The first start prints the new admin's password; it is a throwaway, but the log is public.
          sed 's/password: .*/password: (redacted)/' server.log
          exit 1

  release:
    name: Prepare the draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    needs: [setup, build, build-runner, ci, tag]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: report-portal-*
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: app-runner-*
      - name: Refuse a tag whose release is already published
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/release_guard.py guard-draft "$VERSION" --repo "$REPO"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck fixed image before replacing draft assets
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:${{ needs.setup.outputs.tag }}
          RUNNER_IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner:${{ needs.setup.outputs.tag }}
        run: |
          python3 scripts/release_guard.py guard "$IMAGE"
          python3 scripts/release_guard.py guard "$RUNNER_IMAGE"
      - name: Package archives
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          # Exactly six platforms or the release is incomplete; a missing artifact must not ship
          # as a five-platform release with a green check.
          set -- artifacts/report-portal-*
          test "$#" = 6 || { echo "expected 6 platform artifacts, found $#"; exit 1; }
          for dir in artifacts/report-portal-*; do
            np="${dir#artifacts/report-portal-}"   # e.g. linux-amd64
            goos="${np%-*}"; goarch="${np##*-}"
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            pkg="report-portal_${VERSION}_${goos}_${goarch}"
            mkdir -p "build/${pkg}"
            cp "${dir}/report-portal${ext}" "build/${pkg}/"
            chmod +x "build/${pkg}/report-portal${ext}" || true
            # README + example config + LICENSE are tracked files; a missing one must fail the
            # release loudly rather than ship an incomplete archive.
            cp README.md config.example.yaml LICENSE "build/${pkg}/"
            mkdir -p "build/${pkg}/third-party/moby-profiles"
            cp internal/apprunner/driver/seccomp/LICENSE internal/apprunner/driver/seccomp/README.md "build/${pkg}/third-party/moby-profiles/"
            if [ "$goos" = "windows" ]; then
              (cd build && zip -qr "../dist/${pkg}.zip" "${pkg}")
            else
              tar -C build -czf "dist/${pkg}.tar.gz" "${pkg}"
            fi
          done
          # The app-runner archives (Linux only, doc 182 D8) sit beside the six portal archives and share the checksum
          # file. The portal archives above are unchanged. Exactly two runner artifacts or the release is incomplete.
          set -- artifacts/app-runner-*
          test "$#" = 2 || { echo "expected 2 app-runner artifacts, found $#"; exit 1; }
          for arch in amd64 arm64; do
            pkg="app-runner_${VERSION}_linux_${arch}"
            mkdir -p "build/${pkg}/third-party/moby-profiles" "build/${pkg}/deploy"
            cp "artifacts/app-runner-linux-${arch}/app-runner" "build/${pkg}/"
            chmod +x "build/${pkg}/app-runner"
            cp LICENSE "build/${pkg}/"
            cp deploy/app-runner/* "build/${pkg}/deploy/"
            cp internal/apprunner/driver/seccomp/LICENSE internal/apprunner/driver/seccomp/README.md "build/${pkg}/third-party/moby-profiles/"
            tar -C build -czf "dist/${pkg}.tar.gz" "${pkg}"
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - name: Generate release body
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          OWNER_LC: ${{ needs.setup.outputs.owner_lc }}
          REPO_LC: ${{ needs.setup.outputs.repo_lc }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents)' "refs/tags/${VERSION}" > reader_notes.md
          grep -q '[^[:space:]]' reader_notes.md || {
            echo "::error::annotated tag ${VERSION} has an empty release note"; exit 1; }
          # The portal renders only this bounded section. Deployment, verification and generated
          # pull-request material stay useful on GitHub without leaking into the reader dialog.
          {
            printf '%s\n' '<!-- portal-notes:start -->'
            cat reader_notes.md
            printf '\n%s\n\n' '<!-- portal-notes:end -->'
            # The fixed tag only. This body is written before the release is published, so it states
            # the channel rules rather than this release's outcome: :beta follows the newest published
            # release, and :latest follows the newest FULL one, so a pre-release does not move it.
            cat <<EOF
          ### Container image (ghcr.io)

          \`\`\`shell
          docker pull ghcr.io/${OWNER_LC}/${REPO_LC}:${VERSION}
          \`\`\`

          This fixed tag is this artifact set and is never repointed. \`:beta\` follows the newest
          published release; \`:latest\` follows the newest full release, so a release published as a
          pre-release does not move it.

          The application runner has its own image, under the same tags. One \`PORTAL_VERSION\` selects both in
          the compose project; always update them together:

          \`\`\`shell
          docker pull ghcr.io/${OWNER_LC}/${REPO_LC}-app-runner:${VERSION}
          \`\`\`

          ### Verify

          \`\`\`shell
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ### App runner (Linux only)

          \`app-runner_${VERSION}_linux_amd64.tar.gz\` and \`..._linux_arm64.tar.gz\` carry the runtime runner for
          backend apps, with its systemd unit and example configuration. They are listed in the same
          \`SHA256SUMS.txt\`. The administrator handbook describes the host it needs.
          EOF
          } > release_notes.md
      - name: Recheck the immutable tag before publication
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::tag ${VERSION} moved during the build; refusing publication"
            exit 1
          }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # The default GITHUB_TOKEN (github-actions[bot]) is blocked from creating releases on
          # this repo (403 "Resource not accessible by integration") despite contents:write, so
          # the release is created with a PAT stored as the RELEASE_PAT secret instead.
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # Still a draft here, and deliberately: the publish job is the last one, so the rolling
          # channels cannot be moved before the image digest is recorded on this release. Maturity
          # is set there.
          draft: true
          # Deliberate: the note above is the changelog a maintainer writes, and GitHub's own
          # "What's Changed" list follows it — the action pre-pends the body we pass to the notes it
          # generates, so the order is our note, the container/verify blocks, then the PR list.
          generate_release_notes: true
          body_path: release_notes.md
          # Replace rather than append, so a re-run of a failed pipeline converges on one body instead
          # of stacking a second copy of the notes onto the draft.
          append_body: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

  docker:
    name: Publish the fixed image tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Runs before publication, and that order carries weight: the release must not be published
    # before this job has pushed the image and recorded its digest on it, or release-channels could
    # be asked to point a rolling channel at bytes that do not exist yet. The image build also
    # runs the glyph gate (scripts/probe-font-coverage.sh, in the runtime-base stage of
    # Dockerfile.release) on both arches — test.yml's docker-image job gates amd64 pre-merge, so by
    # tag time this is re-verification except on arm64, which is first checked here.
    needs: [setup, build, release, smoke-arm64]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-amd64, path: bin/linux-amd64 }
      - uses: actions/download-artifact@v8
        with: { name: report-portal-linux-arm64, path: bin/linux-arm64 }
      - run: chmod +x bin/linux-amd64/report-portal bin/linux-arm64/report-portal
      - name: Recheck the immutable tag before image publication
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::tag ${VERSION} moved during the build; refusing publication"
            exit 1
          }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an already-published fixed tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_guard.py guard "${IMAGE}:${VERSION}"
      - name: Build and push the fixed multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          # No QEMU: Dockerfile.release only COPYs the prebuilt per-arch binary; the debian base
          # image itself is multi-arch.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:${{ needs.setup.outputs.tag }}
          labels: |
            org.opencontainers.image.title=report-portal
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.tag }}
          provenance: false
          # Registry cache, not the per-branch GitHub cache: every tag is a new ref, so type=gha
          # would start cold on each release and re-download ~35 MB of fonts plus the wkhtmltopdf
          # deb per arch. Both the fonts and apt layers live in ghcr instead and are reused across
          # releases. The first release after this change populates the cache (~3 min); later ones
          # only rebuild the COPY layers.
          cache-from: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}:buildcache,mode=max

  # THE APP-RUNNER IMAGE (doc 187). It is published from the same CI-gated chain as the Portal image: it needs the
  # same jobs as `docker`, so the tag job (which needs `ci`, `build`, `build-runner` and `smoke-arm64`) and the draft
  # Release come first, and the tag is rechecked right before the push. The fixed tag is never replaced. After
  # the push each architecture's image is run BY DIGEST before anything is recorded, so a runner image whose entry
  # cannot reach the runner in the host mount namespace is a failed release and `publish` never runs.
  docker-runner:
    name: Publish the fixed app-runner image tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [setup, build-runner, release, smoke-arm64]
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: actions/download-artifact@v8
        with: { name: app-runner-linux-amd64, path: bin/linux-amd64 }
      - uses: actions/download-artifact@v8
        with: { name: app-runner-linux-arm64, path: bin/linux-arm64 }
      - run: chmod +x bin/linux-amd64/app-runner bin/linux-arm64/app-runner
      - name: Recheck the immutable tag before image publication
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          EXPECTED_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          actual=$(git rev-parse --verify "refs/tags/${VERSION}^{commit}")
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::tag ${VERSION} moved during the build; refusing publication"
            exit 1
          }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an already-published fixed tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner
          VERSION: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_guard.py guard "${IMAGE}:${VERSION}"
      # The amd64 image is built, loaded and run BEFORE the fixed tag is pushed (a pushed fixed tag is never replaced,
      # so an image that cannot work must not reach the registry). The arm64 image is run by its own job after the
      # push, from the digest.
      - name: Build the linux/amd64 image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.app-runner
          platforms: linux/amd64
          load: true
          push: false
          tags: app-runner-prepush:amd64
          provenance: false
          cache-from: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner:buildcache
      - name: Run the linux/amd64 image before pushing
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          sh scripts/probe-runner-image.sh app-runner-prepush:amd64 linux/amd64 "${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"
      - name: Build and push the fixed multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.app-runner
          # No QEMU: Dockerfile.app-runner only COPYs the prebuilt per-arch binary.
          platforms: linux/amd64,linux/arm64
          push: true
          # Only the fixed tag: the rolling channels are moved by release-channels.yml, by digest, after the
          # release is published.
          tags: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner:${{ needs.setup.outputs.tag }}
          labels: |
            org.opencontainers.image.title=app-runner
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.tag }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner:buildcache,mode=max
      - name: Run the pushed linux/amd64 image by digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner@${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          sh scripts/probe-runner-image.sh "$IMAGE" linux/amd64 "${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"

  # The arm64 half of the image check. A step cannot change runner, so it is a job; record-metadata and publish
  # need it, so a runner image that cannot start on arm64 never gets published or promoted.
  smoke-runner-image-arm64:
    name: Run the linux/arm64 app-runner image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    needs: [setup, docker-runner]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.setup.outputs.sha }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the image by digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}-app-runner@${{ needs.docker-runner.outputs.digest }}
          VERSION: ${{ needs.setup.outputs.tag }}
          SHORT_SHA: ${{ needs.setup.outputs.short_sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64 || { echo "::error::runner is $(uname -m), not aarch64"; exit 1; }
          sh scripts/probe-runner-image.sh "$IMAGE" linux/arm64 "${VERSION#v} (${SHORT_SHA}, ${BUILD_DATE})"

  # The durable release identity, written once both images exist and both have been run. Durable, because a
  # one-day Actions artifact cannot carry an artifact identity to a promotion that happens days later, and
  # reconciliation needs the digests without pulling the images back. `recorded_at` is when this identity was
  # written; the artifact's own build date is baked into the binary by the -ldflags above and is the
  # authoritative one.
  #
  # The format: the legacy top-level `image` and `digest` keep Portal's values, so older readers and older
  # releases still validate, and `images` adds one {image, digest} entry per image. A release from before the
  # runner image has no `images` map and is verified for Portal only (scripts/release_guard.py).
  record-metadata:
    name: Record the durable release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing: the steps speak to GitHub as RELEASE_PAT, and there is no checkout.
    permissions: {}
    needs: [setup, docker, docker-runner, smoke-runner-image-arm64]
    steps:
      - name: Record the durable release identity on the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          RUNNER_DIGEST: ${{ needs.docker-runner.outputs.digest }}
          IMAGE: ghcr.io/${{ needs.setup.outputs.owner_lc }}/${{ needs.setup.outputs.repo_lc }}
        run: |
          set -euo pipefail
          for d in "$DIGEST" "$RUNNER_DIGEST"; do
            printf '%s' "$d" | grep -Eq '^sha256:[a-f0-9]{64}$' || { echo "::error::an image digest is missing or malformed"; exit 1; }
          done
          jq -n --arg tag "$VERSION" --arg commit "$COMMIT" --arg image "$IMAGE" \
                --arg digest "$DIGEST" --arg runner_digest "$RUNNER_DIGEST" --arg recorded "$(date -u +%FT%TZ)" \
            '{tag: $tag, commit: $commit, image: $image, digest: $digest, recorded_at: $recorded,
              images: {portal: {image: $image, digest: $digest},
                       "app-runner": {image: ($image + "-app-runner"), digest: $runner_digest}}}' \
            > release-metadata.json
          cat release-metadata.json
          # --clobber so a retry of this step converges instead of failing on the file it wrote.
          gh release upload "$VERSION" release-metadata.json --repo "$REPO" --clobber

  publish:
    name: Publish the Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing: the one step speaks to GitHub as RELEASE_PAT, and there is no checkout.
    permissions: {}
    # Last, and the order is load-bearing. Publishing is what a reader sees and what
    # release-channels reacts to, and reconciliation reads the image digests record-metadata writes
    # on this release — so publishing any earlier could point :beta at an image that is not pushed.
    # It needs the runner image's jobs too: a release is never published, and so never promoted, without
    # its runner image (doc 187 section 12).
    needs: [setup, docker, docker-runner, smoke-runner-image-arm64, record-metadata]
    steps:
      - name: Publish the prepared draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.tag }}
          # `inputs` is empty on a tag push, and empty means the default: Beta.
          MATURITY: ${{ inputs.maturity || 'beta' }}
        run: |
          set -euo pipefail
          case "${MATURITY}" in
            beta | prerelease) flags="--prerelease" ;;
            stable | release) flags="--prerelease=false" ;;
            draft)
              # The escape hatch, and a deliberate outcome rather than a skipped step: a release
              # that has to be read before it is public stays invisible until someone publishes it.
              echo "maturity=draft — leaving ${VERSION} unpublished"
              exit 0
              ;;
            *)
              echo "::error::unknown maturity '${MATURITY}' (beta | stable | draft)"
              exit 1
              ;;
          esac
          # Publishing fires the `published` release event; release-channels relays it to a
          # reconcile run on the default branch. A failure here leaves the release a draft, which is
          # the safe end: no channel moves on a release nobody can see.
          gh release edit "${VERSION}" --repo "${REPO}" --draft=false ${flags}
          # Read it back, so a release that is still invisible reports itself instead of a green
          # pipeline leaving the channels where they were.
          state=$(gh release view "${VERSION}" --repo "${REPO}" \
            --json isDraft,isPrerelease --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease)"')
          echo "published ${VERSION}: ${state}"
